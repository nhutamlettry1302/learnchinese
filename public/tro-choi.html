function snake(R,end){const L={3:11,8:17,14:23,20:27},Sn={16:6,24:13,29:19,26:10},SP={5:'star',12:'star',22:'star',9:'rock',18:'rock',28:'rock',15:'whirl',25:'whirl',7:'pearl',21:'pearl'};

 const draw=()=>{const cells=[];for(let n=1;n<=30;n++){const[r,c]=rc(n);cells.push({n,r:4-r,c})}cells.sort((a,b)=>a.r-b.r||a.c-b.c);
  R.innerHTML=`<button class="btn sm" id="snake-project" aria-pressed="${document.body.classList.contains('snake-project')}">⛶ Phóng to bàn chơi</button><div class="snake-layout"><section class="snake-board-panel"><div class="stat"><span class="pill">Lượt ${turns}</span><span class="muted sleg">${RWL.IC('ladder',18)} thang lên · ${RWL.IC('eel',18)} lươn xuống · ${RWL.IC('star-fish',18)} +3 · ${RWL.IC('rock',18)} lùi 2 · ${RWL.IC('whirlpool',18)} lỡ lượt · ${RWL.IC('pearl',18)} đổ thêm</span></div><div class="board">${cells.map(x=>`<div class="cell ${pos.includes(x.n)?'occupied':''} ${L[x.n]?'l':Sn[x.n]?'s':SP[x.n]?'p '+(SP[x.n]==='rock'||SP[x.n]==='whirl'?'bad':'good'):''}"><span class="cell-number">${x.n}</span><em>${cellIc(x.n)}</em><span class="tk ${pos[0]===x.n&&pos[1]===x.n?'duo':''}">${pos[0]===x.n?`<span class="me${hopW===0?' hop':''}${waitHop?' wait':''}">${RWL.petHtml(RWL.myPet(),108)}</span>`:''}${pos[1]===x.n?`<span class="${hopW===1?'hop':''}">${RWL.IC('shark',120)}</span>`:''}</span></div>`).join('')}</div><div class="startbar"><b>Xuất phát</b><span class="tk0">${pos[0]===0?`<span class="me${hopW===0?' hop':''}${waitHop?' wait':''}">${RWL.petHtml(RWL.myPet(),108)}</span>`:''}${pos[1]===0?`<span class="${hopW===1?'hop':''}">${RWL.IC('shark',120)}</span>`:''}</span></div>

 const roll=async w=>{D={face:6,rolling:false,wait:w===0};info=w===0?'Trả lời đúng! Lắc xúc xắc nào':'Cá mập đang lắc xúc xắc…';draw();

   if(manual&&w===0){info='Bấm “Đi thêm một bước” để di chuyển! Còn '+(Math.abs(n)-i)+' bước';hopW=-1;await new Promise(res=>{waitHop=res;draw()})}

 (async()=>{for(;;){turns++;

 nx();i1=setInterval(()=>{T--;const e=$('tm');if(e)e.textContent=T;if(T<=0){cleanup();cleanup=()=>{};end(sc*10)}},1000);cleanup=()=>clearInterval(i1)}
/* 16. Trí nhớ chuỗi */
function seq(R,end){let len=2,sc=0,items=[],pos=0,lock=true,hearts=3,dead=false;const pool=()=>S(CT.vocab.filter(x=>x.zh.length<=2)).slice(0,6);
 const round=async()=>{const P=pool();items=Array.from({length:len},()=>P[rnd(P.length)]);pos=0;lock=true;
  R.innerHTML=`<div class="stat"><span class="pill">Dãy ${len} chữ</span><span class="pill">Điểm <b>${sc}</b></span><span class="heart">${RWL.HEARTS(hearts,3)}</span></div><div id="sq" style="text-align:center;font:800 56px 'Noto Serif SC',serif;min-height:90px;margin:12px 0"></div><p class="muted" id="ms" style="text-align:center">Nhìn kỹ thứ tự…</p><div class="ans" style="grid-template-columns:repeat(3,1fr)">${P.map((w,k)=>`<button data-k="${k}" style="font:800 22px 'Noto Serif SC',serif" disabled>${E(w.zh)}</button>`).join('')}</div>`;
  for(const it of items){if(dead)return;$('sq').textContent=it.zh;await new Promise(r=>setTimeout(r,800));if(dead)return;$('sq').textContent='';await new Promise(r=>setTimeout(r,250))}
  if(dead)return;$('ms').textContent='Bấm lại đúng thứ tự!';lock=false;R.querySelectorAll('.ans button').forEach(b=>{b.disabled=false;b.onclick=()=>{if(lock)return;const w=P[+b.dataset.k];if(w.zh===items[pos].zh){C.beep(true);pos++;$('sq').textContent=items.slice(0,pos).map(x=>x.zh).join(' ');if(pos>=items.length){sc+=len*10;len=Math.min(9,len+1);lock=true;setTimeout(round,700)}}else{C.beep(false);hearts--;lock=true;$('ms').textContent='Sai rồi! Đáp án đúng: '+items.map(x=>x.zh).join(' ');if(hearts<=0)return setTimeout(()=>end(sc*10),1500);setTimeout(round,1700)}}})};
 cleanup=()=>{dead=true};round()}
/* 7. Nối đường (Pikachu) */
function onet(R,end){const RW=4,CW=6;const W=wordsN(RW*CW/2);if(W.length<RW*CW/2)return end(0);
 let T=S(W.flatMap((w,i)=>[{i,t:w.zh,z:1},{i,t:w.vn,z:0}])),alive=T.map(()=>true),sel=-1,t0=Date.now(),hints=3,shufs=3,pen=0,left=T.length;
 const occ=(r,c)=>{if(r<0||c<0||r>=RW||c>=CW)return false;return alive[r*CW+c]};
 const link=(a,b)=>{const[r1,c1]=[Math.floor(a/CW),a%CW],[r2,c2]=[Math.floor(b/CW),b%CW];const D=[[1,0],[-1,0],[0,1],[0,-1]];const best={};const q=[[r1,c1,-1,0]];
  while(q.length){const[r,c,d,n]=q.shift();for(let k=0;k<4;k++){const nr=r+D[k][0],nc=c+D[k][1],nn=n+(d>=0&&d!==k?1:0);if(nn>2)continue;if(nr<-1||nc<-1||nr>RW||nc>CW)continue;
    if(nr===r2&&nc===c2)return true;if(occ(nr,nc))continue;const key=nr+','+nc+','+k;if(best[key]!==undefined&&best[key]<=nn)continue;best[key]=nn;q.push([nr,nc,k,nn])}}return false};
 const same=(a,b)=>T[a].i===T[b].i&&T[a].z!==T[b].z;
 const find=()=>{const L=T.map((_,i)=>i).filter(i=>alive[i]);for(let x=0;x<L.length;x++)for(let y=x+1;y<L.length;y++)if(same(L[x],L[y])&&link(L[x],L[y]))return[L[x],L[y]];return null};
 const draw=()=>{R.innerHTML=`<div class="stat"><span class="pill">Còn ${left/2} cặp</span><button class="btn sm" id="ht" ${hints?'':'disabled'}>💡 Gợi ý (${hints})</button><button class="btn sm" id="sf" ${shufs?'':'disabled'}>🔀 Xáo (${shufs})</button></div><div class="tiles" style="grid-template-columns:repeat(${CW},1fr)">${T.map((x,j)=>`<button class="tl ${x.z?'zh':''} ${alive[j]?'':'gone'} ${sel===j?'sel':''}" data-j="${j}" style="font-size:${x.z?20:12}px;min-height:62px">${E(x.t)}</button>`).join('')}</div>`;
  R.querySelectorAll('.tl').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(!alive[j])return;if(T[j].z&&window.rwSay)rwSay(T[j].t);if(sel<0){sel=j;return draw()}if(sel===j){sel=-1;return draw()}
   if(same(sel,j)&&link(sel,j)){C.beep(true);alive[sel]=alive[j]=false;left-=2;sel=-1;if(left===0)return end(Math.max(100,2000-(Date.now()-t0)/1000*5-pen));if(!find())shuffle(true);draw()}else{C.beep(false);pen+=30;sel=-1;draw()}});
  $('ht').onclick=()=>{const p=find();if(!p)return;hints--;pen+=60;sel=-1;draw();p.forEach(j=>R.querySelector('[data-j="'+j+'"]').classList.add('sel'));sel=p[0]};
  $('sf').onclick=()=>{shufs--;pen+=60;shuffle();draw()}};
 const shuffle=()=>{const idx=T.map((_,i)=>i).filter(i=>alive[i]),vals=S(idx.map(i=>T[i]));let g=0;do{const v=S(vals);idx.forEach((i,k)=>T[i]=v[k])}while(!find()&&g++<30)};
 draw()}
/* 8. Đào vàng */
const AN=new Image();AN.src='assets/game/anchor-hook.svg';
function gold(R,end){R.innerHTML=`<div class="stat"><span class="pill"><b id="tm">60</b>s</span><span class="pill">Điểm <b id="sc">0</b></span></div><div style="text-align:center;font:800 22px var(--f-d);margin:4px 0">Móc viên vàng nghĩa là: <span id="tg"></span></div><canvas id="cv" width="440" height="380" style="width:100%;border:3px solid var(--outline);border-radius:18px;background:linear-gradient(#e9d9b0 0 70px,#a77a46 70px);touch-action:manipulation"></canvas>`;
 const cv=$('cv'),k=cv.getContext('2d'),PX=220,PY=48;let sc=0,T=60,tg,items=[],ang=0,t=0,claw=null,raf,dead=false;
 const mkItem=(w)=>{for(let g=0;g<50;g++){const x=40+Math.random()*360,y=130+Math.random()*220;if(items.every(o=>Math.hypot(o.x-x,o.y-y)>78))return{w,x,y,r:34}}return{w,x:40+Math.random()*360,y:130+Math.random()*220,r:34}};
 const newT=()=>{const cand=items.length?items[rnd(items.length)].w:CT.vocab[0];tg=cand;$('tg').textContent=tg.vn};
 const W=wordsN(7);W.forEach(w=>items.push(mkItem(w)));newT();
 const fire=()=>{if(!claw&&!dead)claw={a:ang,len:0,out:true,got:null}};cv.onclick=fire;const kd=e=>{if(e.code==='Space'){e.preventDefault();fire()}};addEventListener('keydown',kd);
 const loop=()=>{t+=.03;ang=Math.sin(t)*1.15;k.clearRect(0,0,440,380);k.fillStyle='#8a5a2b';k.fillRect(PX-26,40,52,12);
  items.forEach(o=>{k.beginPath();k.arc(o.x,o.y,o.r,0,7);k.fillStyle='#f2c230';k.fill();k.lineWidth=3;k.strokeStyle='#8a6a10';k.stroke();k.fillStyle='#3a2a00';k.font='800 '+(o.w.zh.length>=4?14:o.w.zh.length===3?18:24)+'px "Noto Serif SC",serif';k.textAlign='center';k.textBaseline='middle';k.fillText(o.w.zh,o.x,o.y)});
  const a=claw?claw.a:ang;let L=claw?claw.len:30;if(claw){if(claw.out){claw.len+=7;const hx=PX+Math.sin(claw.a)*claw.len,hy=PY+Math.cos(claw.a)*claw.len;const o=items.find(o=>Math.hypot(o.x-hx,o.y-hy)<o.r);if(o){claw.got=o;claw.out=false}else if(hx<8||hx>432||hy>372)claw.out=false}else{claw.len-=claw.got?4:9;if(claw.got){claw.got.x=PX+Math.sin(claw.a)*claw.len;claw.got.y=PY+Math.cos(claw.a)*claw.len}
   if(claw.len<=24){const o=claw.got;if(o){if(o.w.zh===tg.zh){C.beep(true);sc+=20;if(window.rwSay)rwSay(o.w.zh)}else{C.beep(false);sc=Math.max(0,sc-10)}items.splice(items.indexOf(o),1);const used=new Set(items.map(x=>x.w.zh));const pool=CT.vocab.filter(w=>!used.has(w.zh)&&!items.some(x=>x.w.vn===w.vn));const nw=pool.length?pool[rnd(pool.length)]:CT.vocab[rnd(CT.vocab.length)];items.push(mkItem(nw));newT();$('sc').textContent=sc}claw=null}}}
  const hx=PX+Math.sin(a)*L,hy=PY+Math.cos(a)*L;k.strokeStyle='#444';k.lineWidth=3;k.beginPath();k.moveTo(PX,PY);k.lineTo(hx,hy);k.stroke();if(AN.complete&&AN.naturalWidth)k.drawImage(AN,hx-19,hy-8,38,38);else{k.fillStyle='#555';k.beginPath();k.arc(hx,hy,7,0,7);k.fill()}
  if(!dead)raf=requestAnimationFrame(loop)};
 const iv=setInterval(()=>{$('tm').textContent=--T;if(T<=0){dead=true;cleanup();cleanup=()=>{};end(sc*10)}},1000);cleanup=()=>{dead=true;clearInterval(iv);cancelAnimationFrame(raf);removeEventListener('keydown',kd)};loop()}
/* 9. Cá voi bay */
function flap(R,end){R.innerHTML=`<div class="stat"><span class="pill">Điểm <b id="sc">0</b></span><span class="heart" id="hr"></span><span class="muted">Chạm vào màn hình để vỗ bay</span></div><div style="text-align:center;font:800 20px var(--f-d);min-height:54px" id="qq"></div><canvas id="cv" width="440" height="360" style="width:100%;border:3px solid var(--outline);border-radius:18px;background:linear-gradient(#bfe6f2,#6fb6d0);touch-action:manipulation"></canvas>`;
 const cv=$('cv'),k=cv.getContext('2d'),img=new Image();img.src='img/pets.webp';const pi=RWL.myPet();let y=180,vy=0,hearts=5,sc=0,q,gate,raf,dead=false,inv=120,hit=false;
 const hr=()=>$('hr').innerHTML=RWL.HEARTS(hearts,5);
 const mk=()=>{q=C.makeQ(CT);const wrong=S(q.opts.filter(o=>o!==q.ans))[0],up=Math.random()<.5;$('qq').innerHTML=E(q.prompt)+'<br><small class="muted">'+E(q.sub||'')+'</small>';gate={x:460,top:up?q.ans:wrong,bot:up?wrong:q.ans,ok:up?0:1,done:false}};
 const flapUp=()=>{vy=-5.2};cv.onclick=flapUp;const kd=e=>{if(e.code==='Space'){e.preventDefault();flapUp()}};addEventListener('keydown',kd);
 const GH=124,Y1=55,Y2=232,GW=84;
 const lose=()=>{hearts--;hr();C.beep(false);inv=70;if(hearts<=0){dead=true;cleanup();cleanup=()=>{};end(sc*10)}};
 const loop=()=>{vy+=.22;y+=vy;k.clearRect(0,0,440,360);
  if(y<12||y>348){if(inv<=0)lose();y=Math.max(30,Math.min(330,y));vy=y>200?-4:1}
  gate.x-=1.5;const gx=gate.x;
  [[Y1,gate.top],[Y2,gate.bot]].forEach(([gy,t],i)=>{k.fillStyle='rgba(15,70,90,.85)';k.fillRect(gx,i?gy+GH:0,GW,i?360-gy-GH:gy);if(!i)k.fillRect(gx,Y1+GH,GW,Y2-Y1-GH);
   k.fillStyle='#fff';k.fillRect(gx-6,gy,GW+12,GH);k.fillStyle='#0f3a46';k.font='800 '+(t.length<=4?20:t.length<=8?14:12)+'px "Noto Serif SC",Nunito,sans-serif';k.textAlign='center';k.textBaseline='middle';const cap=t.length<=4?4:8,lines=[];for(let s=0;s<t.length&&lines.length<4;s+=cap)lines.push(t.slice(s,s+cap));lines.forEach((ln,j)=>k.fillText(ln,gx+GW/2,gy+GH/2+(j-(lines.length-1)/2)*15))});
  if(img.complete){const w=70,h=w*112/190;if(inv>0&&Math.floor(inv/6)%2)k.globalAlpha=.4;k.save();k.translate(90,y);k.rotate(Math.max(-.5,Math.min(.5,vy*.06)));k.drawImage(img,pi*190,0,190,112,-w/2,-h/2,w,h);k.restore();k.globalAlpha=1}
  if(inv>0)inv--;
  if(!gate.done&&gate.x<125&&gate.x+GW>55){const inTop=y>Y1+2&&y<Y1+GH-2,inBot=y>Y2+2&&y<Y2+GH-2;if(!inTop&&!inBot&&inv<=0){gate.done=true;lose();y=gate.ok===0?Y1+GH/2:Y2+GH/2;vy=0}
   else if(gate.x+GW<95&&!gate.done){gate.done=true;const idx=inTop?0:1;if(idx===gate.ok){C.beep(true);sc++;if(window.rwSay&&q.say)rwSay(q.say);$('sc').textContent=sc*10}else{lose()}}}
  if(gate.x<-GW-10){mk()}
  if(!dead)raf=requestAnimationFrame(loop)};
 hr();mk();cleanup=()=>{dead=true;cancelAnimationFrame(raf);removeEventListener('keydown',kd)};loop()}
