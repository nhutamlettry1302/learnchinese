<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sân chơi ôn tập – Rừng Cá Voi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&family=Noto+Serif+SC:wght@600;800&display=swap">
<link rel="stylesheet" href="rwlive.css">
<script>try{var t=localStorage.getItem('rw_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.gc{cursor:pointer;text-align:left;border:3px solid var(--outline);border-radius:18px;background:var(--panel2);color:var(--ink);padding:14px;font-family:var(--f-b);box-shadow:0 4px 0 var(--outline);transition:transform .1s}.gc:hover{transform:translateY(-2px)}.gc .ic{font-size:38px}.gc b{display:block;font:800 18px var(--f-d);margin:4px 0}.gc small{color:var(--muted,inherit)}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}.tl{min-height:74px;border:3px solid var(--outline);border-radius:14px;background:var(--panel2);color:var(--ink);font:800 17px var(--f-b);cursor:pointer;padding:6px;word-break:break-word}.tl.zh{font:800 26px 'Noto Serif SC',serif}.tl.sel{background:var(--gold);color:#1b1405;transform:scale(1.04)}.tl.gone{visibility:hidden}.tl.bad{animation:shk .35s;background:#f4b4b0}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fc{perspective:600px;min-height:84px}.fc .in{position:relative;width:100%;height:84px;transition:transform .4s;transform-style:preserve-3d}.fc.open .in{transform:rotateY(180deg)}.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--outline);border-radius:14px;display:grid;place-items:center;padding:4px;text-align:center}.fc .f{background:linear-gradient(135deg,#8ccbe0,#5fb0c8);font-size:34px}.fc .b{transform:rotateY(180deg);background:var(--panel2);font:800 16px var(--f-b)}.fc .b.zh{font:800 26px 'Noto Serif SC',serif}.fc.done .b{background:#cfeec6}
.stat{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ladder{display:flex;flex-direction:column-reverse;gap:3px;font:800 13px var(--f-b)}.ladder div{padding:3px 10px;border-radius:8px;background:var(--panel2);border:2px solid var(--outline)}.ladder .cur{background:var(--gold);color:#1b1405}.ladder .safe{border-color:var(--accent)}
.stage{position:relative;height:400px;overflow:hidden;border:3px solid var(--outline);border-radius:18px;background:linear-gradient(#bfe6f2,#6fb6d0)}
.bub{position:absolute;bottom:-90px;width:78px;height:78px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),rgba(190,230,245,.55));font:800 26px 'Noto Serif SC',serif;color:#0f3a46;cursor:pointer;animation:rise linear forwards;padding:0;display:grid;place-items:center}.bub.t{font:800 14px var(--f-b)}.bub.pop{animation:pop .25s forwards}.bub.bad{background:#f4b4b0}
@keyframes rise{to{transform:translateY(-520px)}}@keyframes pop{to{transform:scale(1.6);opacity:0}}
.fall{position:absolute;top:-60px;left:50%;transform:translateX(-50%);font:800 40px 'Noto Serif SC',serif;background:#fff;border:3px solid var(--outline);border-radius:16px;padding:6px 18px;color:#0f3a46;animation:fall linear forwards;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}.fall.t{font:800 20px var(--f-b);white-space:normal;width:90%;text-align:center}
@keyframes fall{to{top:340px}}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.cell{position:relative;aspect-ratio:1;border:2.5px solid var(--outline);border-radius:10px;background:var(--panel2);font:800 12px var(--f-b);padding:3px}.cell.l{background:#d3f0cc}.cell.s{background:#f9d5cf}.cell .tk{position:absolute;right:2px;bottom:0;font-size:22px}.cell em{font-style:normal;position:absolute;left:3px;bottom:1px;font-size:11px}
.heart{font-size:22px}.big2{font:800 clamp(34px,10vw,60px) var(--f-d)}
@media(max-width:520px){.tiles{gap:6px}.tl.zh{font-size:22px}}
</style></head><body><div class="wrap narrow">
<div class="top"><a class="btn sm" href="index.html">← Trang chủ</a><span class="brand"><i class="lg"></i>Sân chơi ôn tập</span><span style="flex:1"></span><a class="btn sm" href="live.html">Vào phòng trực tiếp</a></div>
<div id="main"></div></div>
<script src="config.js"></script><script src="audio.js"></script><script src="rwcore.js"></script><script src="rwlive.js"></script>
<script>
const C=RWC,$=id=>document.getElementById(id),E=C.esc,M=$('main');
let CT=null,cleanup=()=>{},tab='vocab',lv={vocab:'HSK1',gram:'HSK1'},msg='';
const GI={pairs:'shell-card',flip:'card-back',mil:'pearl',bub:'bubble',fall:'star-fish',onet:'treasure',gold:'anchor-hook',flap:'coral-gate',snake:'dice',car:'dice',type:'bubble',tf:'star-fish',whack:'rock',listen:'bubble',hang:'pearl',seq:'treasure'};
const gic=(k,w)=>RWL.IC(GI[k],w);
const GAMES=[
 {k:'pairs',ic:'🧩',n:'Nối cặp',d:'Chạm chữ Hán rồi chạm nghĩa tương ứng. Nối hết 3 màn nhanh nhất!',need:'v'},
 {k:'flip',ic:'🃏',n:'Lật thẻ trí nhớ',d:'Lật 2 thẻ để tìm cặp chữ Hán và nghĩa. Ít lượt lật là điểm cao.',need:'v'},
 {k:'mil',ic:'💎',n:'Ai là triệu phú',d:'15 câu hỏi, 2 quyền trợ giúp (50:50 và đổi câu), có 2 mốc an toàn.',need:'q'},
 {k:'bub',ic:'🫧',n:'Bong bóng chữ',d:'60 giây chạm vào bong bóng có chữ Hán đúng với nghĩa trên cùng.',need:'v'},
 {k:'fall',ic:'🌧️',n:'Mưa chữ',d:'Chữ rơi xuống, chọn nghĩa đúng trước khi chạm đáy. Có 3 mạng.',need:'q'},
 {k:'onet',ic:'🐙',n:'Nối đường (kiểu Pikachu)',d:'Nối 2 thẻ cùng cặp bằng đường đi không quá 2 góc rẽ. Có gợi ý và xáo trộn.',need:'v'},
 {k:'gold',ic:'⛏️',n:'Đào vàng',d:'Móc câu đung đưa, chạm để thả. Móc đúng viên vàng có nghĩa ở trên cùng!',need:'v'},
 {k:'flap',ic:'🐳',n:'Cá voi bay',d:'Chạm để cá voi vỗ bay, bay qua cổng có đáp án đúng. Có 5 mạng, bay chậm và cổng rộng.',need:'q'},
 {k:'car',ic:'🏎️',n:'Đua xe',d:'Lái xe qua 3 làn, chạy vào làn có đáp án đúng. Đúng thì xe tăng tốc, sai mất mạng. Có 3 mạng.',need:'q'},
 {k:'type',ic:'⌨️',n:'Gõ pinyin',d:'60 giây gõ pinyin của chữ Hán hiện ra (không cần dấu thanh). Gõ nhanh được nhiều điểm.',need:'v'},
 {k:'tf',ic:'✅',n:'Đúng hay sai',d:'45 giây: chữ Hán và nghĩa có khớp nhau không? Chọn Đúng hoặc Sai thật nhanh, chuỗi đúng liên tiếp được thưởng.',need:'v'},
 {k:'whack',ic:'🔨',n:'Đập chuột chũi',d:'Chuột chũi thò đầu ra mang theo nghĩa. Đập đúng con có nghĩa của chữ Hán ở trên, đập nhầm bị trừ điểm.',need:'v'},
 {k:'listen',ic:'🎧',n:'Nghe và chọn',d:'Nghe phát âm, chọn nghĩa đúng. Luyện nghe 10 từ liên tiếp. Cần bật loa.',need:'v'},
 {k:'hang',ic:'🔤',n:'Đoán pinyin (kiểu treo cổ)',d:'Đoán từng chữ cái của pinyin. Sai 6 lần là thua từ đó. Mỗi từ đoán đúng được thêm điểm.',need:'v'},
 {k:'seq',ic:'🧠',n:'Trí nhớ chuỗi',d:'Nhìn dãy chữ Hán sáng lên rồi bấm lại đúng thứ tự. Dãy dài dần lên.',need:'v'},
 {k:'snake',ic:'🎲',n:'Thang và rắn',d:'Trả lời đúng để lắc xúc xắc. Có thang, lươn, sao biển, đá ngầm, xoáy nước và ngọc trai. Đua với cá mập tới ô 30!',need:'q'}];
const best=k=>+(C.ls.get('rw_best_'+k)||0);
async function load(){CT=await C.Ctx.load()}
function sum(s){const n=o=>Object.values(o||{}).reduce((a,l)=>a+l.length,0);return n(s.vocab)+' bài từ vựng · '+n(s.gram)+' bài ngữ pháp'}
async function home(){cleanup();cleanup=()=>{};await C.Data.need(true,false);await load();const inR=C.Ctx.inRoom,r=C.Room.cfg,sel=C.Ctx.sel,LV=C.Data.vocabLevels();
 const curLv=LV.find(l=>{const a=(sel.vocab||{})[l.k];return a&&Object.keys(sel.vocab).length===1&&a.length===l.ls.length});
 M.innerHTML=`<div class="card">${inR?`<div class="row"><div style="flex:1;min-width:200px"><b>Đang chơi theo phòng ${E(r.code)} · ${E(r.name)}</b><div class="muted">${CT.vocab.length} từ vựng · ${CT.quiz.length} câu ngữ pháp · điểm được gửi vào phòng của cô</div></div><button class="btn sm" id="lv">Chơi tự do</button></div>`
  :`<b style="font:800 18px var(--f-d)">Chọn cấp độ để ôn</b><div class="muted" style="margin:2px 0 10px">${curLv?'Đang chọn: '+E(curLv.n)+' (tất cả bài)':'Đang chọn: '+sum(sel)}</div>
  <div class="pick-lv">${LV.map(l=>`<span class="pk ${curLv&&curLv.k===l.k?'on':''}" data-lvl="${E(l.k)}">${E(l.n)}</span>`).join('')}</div>
  <div class="row" style="margin-top:10px"><button class="btn sm" id="pk">📚 Chọn bài cụ thể</button><span class="muted">${CT.vocab.length} từ vựng · ${CT.quiz.length} câu ngữ pháp</span></div>
  <p class="muted" style="margin:10px 0 0">Đang học theo lớp của cô? Vào <a href="live.html"><b>Phòng học</b></a> bằng mã phòng.</p>`}
  ${msg?`<p class="err">${E(msg)}</p>`:''}</div>
 <div class="grid" style="margin-top:12px">${GAMES.map(g=>`<button class="gc" data-g="${g.k}"><span class="ic">${gic(g.k,52)}</span><b>${g.n}</b><small>${g.d}</small>${best(g.k)?`<div style="margin-top:6px"><span class="pill">Kỷ lục ${best(g.k)}</span></div>`:''}</button>`).join('')}</div>`;
 const lvb=$('lv');if(lvb)lvb.onclick=()=>{C.Room.leave();home()};const pk=$('pk');if(pk)pk.onclick=picker;
 document.querySelectorAll('[data-lvl]').forEach(b=>b.onclick=async()=>{const k=b.dataset.lvl,L=LV.find(l=>l.k===k),s={vocab:{[k]:L.ls.map(x=>x.n)},gram:{}};await C.Data.need(true,true);const G=C.Data.gramLevels().find(x=>x.k===k);if(G)s.gram[k]=G.ls.map(x=>x.n);C.Ctx.setSel(s);msg='';home()});
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>start(b.dataset.g))}
function picker(){const s=C.Ctx.sel;s.vocab=s.vocab||{};s.gram=s.gram||{};C.Data.need(true,true).then(()=>{const draw=()=>{const L=tab==='vocab'?C.Data.vocabLevels():C.Data.gramLevels(),cur=L.find(l=>l.k===lv[tab])||L[0],S=s[tab];S[cur.k]=S[cur.k]||[];
 M.innerHTML=`<div class="card"><h2>Chọn bài để ôn</h2><div class="tabs row"><button class="btn sm ${tab==='vocab'?'pri':''}" data-tab="vocab">Từ vựng</button><button class="btn sm ${tab==='gram'?'pri':''}" data-tab="gram">Ngữ pháp</button><span style="flex:1"></span><span class="muted">${sum(s)}</span></div>
 <div class="pick-lv" style="margin-top:8px">${L.map(l=>`<span class="pk ${l.k===cur.k?'on':''}" data-lv="${E(l.k)}">${E(l.n)}${(S[l.k]||[]).length?' ('+S[l.k].length+')':''}</span>`).join('')}</div>
 <div class="row" style="margin:6px 0"><button class="btn sm" data-all="1">Chọn hết ${E(cur.n)}</button><button class="btn sm" data-none="1">Bỏ hết</button></div>
 <div class="pick-ls">${cur.ls.map(x=>`<span class="pk ${S[cur.k].includes(x.n)?'on':''}" data-ls="${x.n}">Bài ${x.n}${x.t?' · '+E(String(x.t).slice(0,18)):''}</span>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn pri" id="ok">Xong</button></div></div>`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{lv[tab]=b.dataset.lv;draw()});
 document.querySelectorAll('[data-ls]').forEach(b=>b.onclick=()=>{const n=+b.dataset.ls,a=S[cur.k],i=a.indexOf(n);i>=0?a.splice(i,1):a.push(n);draw()});
 document.querySelector('[data-all]').onclick=()=>{S[cur.k]=cur.ls.map(x=>x.n);draw()};document.querySelector('[data-none]').onclick=()=>{S[cur.k]=[];draw()};
 $('ok').onclick=()=>{['vocab','gram'].forEach(k=>Object.keys(s[k]).forEach(l=>{if(!s[k][l].length)delete s[k][l]}));C.Ctx.setSel(s);home()}};draw()})}
/* ---- khung chung ---- */
function start(k){cleanup();cleanup=()=>{};const g=GAMES.find(x=>x.k===k);
 if(g.need==='v'&&CT.vocab.length<8){msg='Trò này cần ít nhất 8 từ vựng. Hãy chọn thêm bài từ vựng.';return home()}
 if(g.need==='q'&&!C.makeQ(CT)){msg='Chưa đủ nội dung (cần ít nhất 4 từ vựng hoặc có câu ngữ pháp).';return home()}
 msg='';const G={pairs,flip,mil,bub,fall,snake,onet,gold,flap,car,type,tf,whack,listen,hang,seq}[k];
 M.innerHTML=`<div class="card"><div class="row"><b style="font:800 20px var(--f-d)">${gic(g.k,30)} ${g.n}</b><span style="flex:1"></span><button class="btn sm" id="bk">← Chọn trò khác</button></div><div id="g" style="margin-top:10px"></div></div>`;$('bk').onclick=()=>home();
 G($('g'),score=>finish(k,g,score,()=>start(k)))}
function finish(k,g,score,again){cleanup();cleanup=()=>{};score=Math.max(0,Math.round(score));const nb=score>best(k);if(nb)C.ls.set('rw_best_'+k,String(score));
 const inR=C.Ctx.inRoom;if(inR)C.submit('solo-'+k,score);
 $('g').innerHTML=`<div style="text-align:center"><div class="big2">${nb?RWL.IC('medal-gold',54):RWL.petHtml(RWL.myPet(),84)} ${score}</div><p>${nb?'Kỷ lục mới!':'Kỷ lục của bạn: '+best(k)}</p>${inR?'<p class="muted">Điểm đã gửi vào phòng của cô.</p>':'<p class="muted">Vào phòng bằng mã để điểm hiện trên bảng xếp hạng của lớp.</p>'}<div class="row" style="justify-content:center"><button class="btn pri" id="ag">Chơi lại</button><button class="btn" id="bk2">Chọn trò khác</button></div></div>`;$('ag').onclick=again;$('bk2').onclick=()=>home()}
const S=C.shuf,rnd=n=>Math.floor(Math.random()*n),zhFont=w=>/[一-鿿]/.test(w);
const wordsN=n=>{const seen=new Set(),o=[];for(const w of S(CT.vocab)){if(seen.has(w.zh)||seen.has(w.vn))continue;seen.add(w.zh);seen.add(w.vn);o.push(w);if(o.length>=n)break}return o};
/* 1. Nối cặp */
function pairs(R,end){let round=0,t0=Date.now(),miss=0,sel=null,left=0;
 const next=()=>{if(round>=3)return end(1800-(Date.now()-t0)/1000*8-miss*40);const W=wordsN(6);if(W.length<4)return end(500);left=W.length;sel=null;
  const T=S(W.flatMap((w,i)=>[{i,t:w.zh,z:1},{i,t:w.vn,z:0}]));R.innerHTML=`<div class="stat"><span class="pill">Màn ${round+1}/3</span><span class="muted">Sai: <b id="ms">${miss}</b></span></div><div class="tiles">${T.map((x,j)=>`<button class="tl ${x.z?'zh':''}" data-j="${j}">${E(x.t)}</button>`).join('')}</div>`;
  R.querySelectorAll('.tl').forEach(b=>b.onclick=()=>{const x=T[+b.dataset.j];if(b.classList.contains('gone'))return;if(x.z&&window.rwSay)rwSay(x.t);
   if(!sel){sel=b;b.classList.add('sel');return}if(sel===b){b.classList.remove('sel');sel=null;return}
   const y=T[+sel.dataset.j];if(y.i===x.i&&y.z!==x.z){C.beep(true);sel.classList.add('gone');b.classList.add('gone');sel=null;if(--left===0){round++;setTimeout(next,350)}}
   else{C.beep(false);miss++;$('ms').textContent=miss;const a=sel;a.classList.remove('sel');a.classList.add('bad');b.classList.add('bad');setTimeout(()=>{a.classList.remove('bad');b.classList.remove('bad')},350);sel=null}})};
 next()}
/* 2. Lật thẻ */
function flip(R,end){const W=wordsN(8),T=S(W.flatMap((w,i)=>[{i,t:w.zh,z:1},{i,t:w.vn,z:0}]));let open=[],moves=0,found=0,t0=Date.now(),lock=false;
 R.innerHTML=`<div class="stat"><span class="muted">Lượt lật: <b id="mv">0</b></span><span class="muted">Cặp: <b id="fd">0</b>/${W.length}</span></div><div class="tiles">${T.map((x,j)=>`<div class="fc" data-j="${j}"><div class="in"><div class="f"><img src="assets/game/card-back.svg" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit"></div><div class="b ${x.z?'zh':''}">${E(x.t)}</div></div></div>`).join('')}</div>`;
 R.querySelectorAll('.fc').forEach(c=>c.onclick=()=>{if(lock||c.classList.contains('open'))return;const x=T[+c.dataset.j];c.classList.add('open');if(x.z&&window.rwSay)rwSay(x.t);open.push(c);
  if(open.length===2){moves++;$('mv').textContent=moves;const[a,b]=open.map(e=>T[+e.dataset.j]);open=[];const els=[...R.querySelectorAll('.fc.open:not(.done)')];
   if(a.i===b.i){C.beep(true);els.forEach(e=>e.classList.add('done'));found++;$('fd').textContent=found;if(found===W.length)setTimeout(()=>end(Math.max(100,1600-moves*40-(Date.now()-t0)/1000*3)),600)}
   else{lock=true;C.beep(false);setTimeout(()=>{els.forEach(e=>e.classList.remove('open'));lock=false},850)}}})}
/* 3. Ai là triệu phú */
function mil(R,end){const P=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];let lvl=0,q=null,used={f:0,s:0},locked=false;
 const safe=()=>lvl>=10?10:lvl>=5?5:0;
 const draw=(hid)=>{R.innerHTML=`<div class="row" style="align-items:flex-start"><div style="flex:1;min-width:240px"><div class="stat"><span class="pill">Câu ${lvl+1}/15 · ${P[lvl].toLocaleString('vi')}</span><button class="btn sm" id="f5" ${used.f?'disabled':''}>50:50</button><button class="btn sm" id="sw" ${used.s?'disabled':''}>🔄 Đổi câu</button></div>
  <div style="text-align:center;margin:10px 0"><div class="big" style="${q.zh?'':'font-family:var(--f-d);font-size:clamp(22px,6vw,38px)'}">${E(q.prompt)}</div><div class="muted">${E(q.sub||'')}</div></div>
  <div class="ans">${q.opts.map((o,k)=>`<button data-k="${k}" class="${hid&&hid.includes(k)?'dim':''}" ${hid&&hid.includes(k)?'disabled':''}>${E(o)}</button>`).join('')}</div></div>
  <div class="ladder" style="width:130px">${P.map((p,i)=>`<div class="${i===lvl?'cur':''} ${i===4||i===9?'safe':''}">${i+1} · ${p>=1000?p/1000+'K':p}</div>`).join('')}</div></div>`;
  $('f5').onclick=()=>{used.f=1;const w=[0,1,2,3].filter(k=>q.opts[k]!==q.ans);draw(S(w).slice(0,2))};$('sw').onclick=()=>{used.s=1;q=C.makeQ(CT);draw()};
  R.querySelectorAll('.ans button').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const k=+b.dataset.k;if(window.rwSay&&q.say)rwSay(q.say);
   R.querySelectorAll('.ans button').forEach((x,i)=>{if(q.opts[i]===q.ans)x.classList.add('right');else if(i===k)x.classList.add('wrong')});
   setTimeout(()=>{locked=false;if(q.opts[k]===q.ans){C.beep(true);lvl++;if(lvl>=15)return end(P[14]/100+1000);q=C.makeQ(CT);draw()}else{C.beep(false);end(safe()?P[safe()-1]/100:0)}},1100)})};
 q=C.makeQ(CT);draw()}
/* 4. Bong bóng chữ */
function bub(R,end){let sc=0,T=60,tg=null,n=0;const stage=document.createElement('div');

/* 6. Thang và rắn */
function snake(R,end){const L={3:11,8:17,14:23,20:27},Sn={16:6,24:13,29:19,26:10},SP={5:'star',12:'star',22:'star',9:'rock',18:'rock',28:'rock',15:'whirl',25:'whirl',7:'pearl',21:'pearl'};
 const EF={star:{ic:'star-fish',t:'Sao biển! Tiến thêm 3 bước',d:3},rock:{ic:'rock',t:'Đá ngầm! Lùi 2 bước',d:-2},whirl:{ic:'whirlpool',t:'Xoáy nước! Lỡ 1 lượt',skip:1},pearl:{ic:'pearl',t:'Ngọc trai! Được đổ xúc xắc thêm 1 lần',extra:1}};
 let pos=[0,0],turns=0,q=null,dead=false,skip=[0,0],D=null,info='',hopW=-1,waitHop=null;const WN=['Bạn','Cá mập'];
 const sleep=ms=>new Promise(r=>setTimeout(()=>{if(!dead)r()},ms));cleanup=()=>{dead=true};
 const rc=n=>{const r=Math.floor((n-1)/6),c=(n-1)%6;return[r,r%2?5-c:c]};
 const PM={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
 const dice=(n,cls)=>`<div class="dice3 ${cls||''}">${Array.from({length:9},(_,i)=>`<i class="${PM[n].includes(i)?'on':''}"></i>`).join('')}</div>`;
 const cellIc=n=>L[n]?RWL.IC('ladder',16)+L[n]:Sn[n]?RWL.IC('eel',16)+Sn[n]:SP[n]?RWL.IC(EF[SP[n]].ic,18):'';
 const draw=()=>{const cells=[];for(let n=1;n<=30;n++){const[r,c]=rc(n);cells.push({n,r:4-r,c})}cells.sort((a,b)=>a.r-b.r||a.c-b.c);
  R.innerHTML=`<div class="stat"><span class="pill">Lượt ${turns}</span><span class="muted sleg">${RWL.IC('ladder',18)} thang lên · ${RWL.IC('eel',18)} lươn xuống · ${RWL.IC('star-fish',18)} +3 · ${RWL.IC('rock',18)} lùi 2 · ${RWL.IC('whirlpool',18)} lỡ lượt · ${RWL.IC('pearl',18)} đổ thêm</span></div><div class="board">${cells.map(x=>`<div class="cell ${L[x.n]?'l':Sn[x.n]?'s':SP[x.n]?'p '+(SP[x.n]==='rock'||SP[x.n]==='whirl'?'bad':'good'):''}">${x.n}<em>${cellIc(x.n)}</em><span class="tk">${pos[0]===x.n?`<span class="me${hopW===0?' hop':''}${waitHop?' wait':''}">${RWL.petHtml(RWL.myPet(),56)}</span>`:''}${pos[1]===x.n?`<span class="${hopW===1?'hop':''}">${RWL.IC('shark',48)}</span>`:''}</span></div>`).join('')}</div><div class="startbar"><b>Xuất phát</b><span class="tk0">${pos[0]===0?`<span class="me${hopW===0?' hop':''}${waitHop?' wait':''}">${RWL.petHtml(RWL.myPet(),56)}</span>`:''}${pos[1]===0?`<span class="${hopW===1?'hop':''}">${RWL.IC('shark',48)}</span>`:''}</span></div>
  <p style="text-align:center;font-weight:800;min-height:26px;margin:8px 0">${E(info)}</p>
  ${D?`<div class="dicebox">${dice(D.face,D.rolling?'roll':'')}${D.wait?`<button class="btn pri" id="rollb">Bấm để lắc xúc xắc</button>`:''}</div>`:''}
  ${q?`<div style="text-align:center;margin:6px 0"><div class="big" style="${q.zh?'':'font-family:var(--f-d);font-size:clamp(20px,5vw,32px)'}">${E(q.prompt)}</div></div><div class="ans">${q.opts.map((o,k)=>`<button data-k="${k}">${E(o)}</button>`).join('')}</div>`:''}`};
 const ask=()=>new Promise(res=>{q=C.makeQ(CT);info='Đến lượt bạn: trả lời đúng để được lắc xúc xắc';D=null;draw();R.querySelectorAll('.ans button').forEach(b=>b.onclick=()=>{const ok=q.opts[+b.dataset.k]===q.ans;if(window.rwSay&&q.say)rwSay(q.say);C.beep(ok);q=null;res(ok)})});
 const roll=async w=>{D={face:6,rolling:false,wait:w===0};info=w===0?'Trả lời đúng! Lắc xúc xắc nào':'Cá mập đang lắc xúc xắc…';draw();
  if(w===0){await new Promise(res=>{$('rollb').onclick=res})}else await sleep(700);
  D.wait=false;D.rolling=true;const d=1+rnd(6);for(let i=0;i<11;i++){D.face=1+rnd(6);info='Đang lắc…';draw();await sleep(85)}
  D.face=d;D.rolling=false;info=WN[w]+' đổ được '+d+'!';draw();await sleep(800);return d};
 R.addEventListener('click',e=>{if(waitHop&&e.target.closest('.me')){const f=waitHop;waitHop=null;f()}});
 const step=async(w,n,manual)=>{const dir=n>0?1:-1;for(let i=0;i<Math.abs(n);i++){const np=pos[w]+dir;if(np<1||np>30)break;
   if(manual&&w===0){info='Bấm vào cá voi để nhảy! Còn '+(Math.abs(n)-i)+' bước';hopW=-1;await new Promise(res=>{waitHop=res;draw()})}
   pos[w]=np;hopW=w;draw();await sleep(w===0&&manual?320:260);if(pos[w]>=30)break}hopW=-1;waitHop=null};
 const land=async w=>{let extra=false;for(let g=0;g<4&&pos[w]<30;g++){const p=pos[w];
   if(L[p]){info=WN[w]+' leo thang!';pos[w]=L[p];draw();await sleep(1000)}
   else if(Sn[p]){info=WN[w]+' gặp lươn biển, tụt xuống!';pos[w]=Sn[p];draw();await sleep(1000)}
   else if(SP[p]){const e=EF[SP[p]];info=WN[w]+': '+e.t;draw();await sleep(1100);if(e.d){await step(w,e.d)}else{if(e.skip)skip[w]=1;if(e.extra)extra=true;break}}
   else break}return extra};
 const finish=w=>{dead=true;setTimeout(()=>{info=w===0?'Bạn về đích trước, thắng rồi!':'Cá mập về đích trước!';draw();setTimeout(()=>end(w===0?Math.max(100,1000-turns*20):100),1300)},0)};
 const turn=async w=>{let again=true;while(again){const d=await roll(w);await step(w,d,true);if(pos[w]>=30)return true;again=await land(w);if(pos[w]>=30)return true;if(again){info=WN[w]+' được đổ thêm 1 lần!';draw();await sleep(900)}}return false};
 (async()=>{for(;;){turns++;
   if(skip[0]){skip[0]=0;D=null;info='Bạn bị xoáy nước cuốn, lỡ lượt này!';draw();await sleep(1500)}
   else{const ok=await ask();D=null;if(!ok){info='Sai rồi, mất lượt!';draw();await sleep(1100)}else if(await turn(0))return finish(0)}
   if(skip[1]){skip[1]=0;D=null;info='Cá mập bị xoáy nước cuốn, lỡ lượt!';draw();await sleep(1300)}
   else{if(Math.random()<.2){D=null;info='Cá mập lỡ lượt!';draw();await sleep(1000)}else if(await turn(1))return finish(1)}}})()}

function hang(R,end){let sc=0,words=0,w,shown,miss,T=120,i1;const nt=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').toLowerCase().replace(/[^a-z]/g,'');

 const draw=()=>{const p=nt(w.py),done=[...p].every(c=>shown.has(c));R.innerHTML=`<div class="stat"><span class="pill"><b id="tm">${T}</b>s</span><span class="pill">Điểm <b>${sc}</b></span><span class="heart">${RWL.HEARTS(6-miss,6)}</span></div><div style="text-align:center;margin:10px 0"><div class="big">${E(w.zh)}</div><div class="muted">${E(w.vn)}</div><div style="font:800 34px var(--f-d);letter-spacing:6px;margin:10px 0">${[...p].map(c=>shown.has(c)||miss>=6?c:'_').join(' ')}</div></div><div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">${'abcdefghijklmnopqrstuvwxyz'.split('').map(c=>`<button data-c="${c}" style="min-width:40px;padding:6px 8px" ${shown.has(c)||done||miss>=6?'disabled':''}>${c}</button>`).join('')}</div>`;
  R.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c;shown.add(c);if(!p.includes(c)){miss++;C.beep(false)}else C.beep(true);const dn=[...p].every(x=>shown.has(x));if(dn){sc+=10+(6-miss)*3;words++;if(window.rwSay)rwSay(w.zh);draw();setTimeout(nx,900);return}if(miss>=6){draw();setTimeout(nx,1200);return}draw()})};
 nx();i1=setInterval(()=>{T--;const e=$('tm');if(e)e.textContent=T;if(T<=0){cleanup();cleanup=()=>{};end(sc*10)}},1000);cleanup=()=>clearInterval(i1)}
/* 16. Trí nhớ chuỗi */
function seq(R,end){let len=2,sc=0,items=[],pos=0,lock=true,hearts=3,dead=false;const pool=()=>S(CT.vocab.filter(x=>x.zh.length<=2)).slice(0,6);
 const round=async()=>{const P=pool();items=Array.from({length:len},()=>P[rnd(P.length)]);pos=0;lock=true;
  R.innerHTML=`<div class="stat"><span class="pill">Dãy ${len} chữ</span><span class="pill">Điểm <b>${sc}</b></span><span class="heart">${RWL.HEARTS(hearts,3)}</span></div><div id="sq" style="text-align:center;font:800 56px 'Noto Serif SC',serif;min-height:90px;margin:12px 0"></div><p class="muted" id="ms" style="text-align:center">Nhìn kỹ thứ tự…</p><div class="ans" style="grid-template-columns:repeat(3,1fr)">${P.map((w,k)=>`<button data-k="${k}" style="font:800 22px 'Noto Serif SC',serif" disabled>${E(w.zh)}</button>`).join('')}</div>`;
  for(const it of items){if(dead)return;$('sq').textContent=it.zh;await new Promise(r=>setTimeout(r,800));if(dead)return;$('sq').textContent='';await new Promise(r=>setTimeout(r,250))}
  if(dead)return;$('ms').textContent='Bấm lại đúng thứ tự!';lock=false;R.querySelectorAll('.ans button').forEach(b=>{b.disabled=false;b.onclick=()=>{if(lock)return;const w=P[+b.dataset.k];if(w.zh===items[pos].zh){C.beep(true);pos++;$('sq').textContent=items.slice(0,pos).map(x=>x.zh).join(' ');if(pos>=items.length){sc+=len*10;len=Math.min(9,len+1);lock=true;setTimeout(round,700)}}else{C.beep(false);hearts--;lock=true;$('ms').textContent='Sai rồi! Đáp án đúng: '+items.map(x=>x.zh).join(' ');if(hearts<=0)return setTimeout(()=>end(sc*10),1500);setTimeout(round,1700)}}})};
 cleanup=()=>{dead=true};round()}
/* 7. Nối đường (Pikachu) */
function onet(R,end){const RW=4,CW=6;const W=wordsN(RW*CW/2);if(W.length<RW*CW/2)return end(0);
 let T=S(W.flatMap((w,i)=>[{i,t:w.zh,z:1},{i,t:w.vn,z:0}])),alive=T.map(()=>true),sel=-1,t0=Date.now(),hints=3,shufs=3,pen=0,left=T.length;
 const occ=(r,c)=>{if(r<0||c<0||r>=RW||c>=CW)return false;return alive[r*CW+c]};
 const link=(a,b)=>{const[r1,c1]=[Math.floor(a/CW),a%CW],[r2,c2]=[Math.floor(b/CW),b%CW];const D=[[1,0],[-1,0],[0,1],[0,-1]];const best={};const q=[[r1,c1,-1,0]];
  while(q.length){const[r,c,d,n]=q.shift();for(let k=0;k<4;k++){const nr=r+D[k][0],nc=c+D[k][1],nn=n+(d>=0&&d!==k?1:0);if(nn>2)continue;if(nr<-1||nc<-1||nr>RW||nc>CW)continue;
    if(nr===r2&&nc===c2)return true;if(occ(nr,nc))continue;const key=nr+','+nc+','+k;if(best[key]!==undefined&&best[key]<=nn)continue;best[key]=nn;q.push([nr,nc,k,nn])}}return false};
 const same=(a,b)=>T[a].i===T[b].i&&T[a].z!==T[b].z;
 const find=()=>{const L=T.map((_,i)=>i).filter(i=>alive[i]);for(let x=0;x<L.length;x++)for(let y=x+1;y<L.length;y++)if(same(L[x],L[y])&&link(L[x],L[y]))return[L[x],L[y]];return null};
 const draw=()=>{R.innerHTML=`<div class="stat"><span class="pill">Còn ${left/2} cặp</span><button class="btn sm" id="ht" ${hints?'':'disabled'}>💡 Gợi ý (${hints})</button><button class="btn sm" id="sf" ${shufs?'':'disabled'}>🔀 Xáo (${shufs})</button></div><div class="tiles" style="grid-template-columns:repeat(${CW},1fr)">${T.map((x,j)=>`<button class="tl ${x.z?'zh':''} ${alive[j]?'':'gone'} ${sel===j?'sel':''}" data-j="${j}" style="font-size:${x.z?20:12}px;min-height:62px">${E(x.t)}</button>`).join('')}</div>`;
  R.querySelectorAll('.tl').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(!alive[j])return;if(T[j].z&&window.rwSay)rwSay(T[j].t);if(sel<0){sel=j;return draw()}if(sel===j){sel=-1;return draw()}
   if(same(sel,j)&&link(sel,j)){C.beep(true);alive[sel]=alive[j]=false;left-=2;sel=-1;if(left===0)return end(Math.max(100,2000-(Date.now()-t0)/1000*5-pen));if(!find())shuffle(true);draw()}else{C.beep(false);pen+=30;sel=-1;draw()}});
  $('ht').onclick=()=>{const p=find();if(!p)return;hints--;pen+=60;sel=-1;draw();p.forEach(j=>R.querySelector('[data-j="'+j+'"]').classList.add('sel'));sel=p[0]};
  $('sf').onclick=()=>{shufs--;pen+=60;shuffle();draw()}};
 const shuffle=()=>{const idx=T.map((_,i)=>i).filter(i=>alive[i]),vals=S(idx.map(i=>T[i]));let g=0;do{const v=S(vals);idx.forEach((i,k)=>T[i]=v[k])}while(!find()&&g++<30)};
 draw()}
/* 8. Đào vàng */
const AN=new Image();AN.src='assets/game/anchor-hook.svg';
function gold(R,end){R.innerHTML=`<div class="stat"><span class="pill"><b id="tm">60</b>s</span><span class="pill">Điểm <b id="sc">0</b></span></div><div style="text-align:center;font:800 22px var(--f-d);margin:4px 0">Móc viên vàng nghĩa là: <span id="tg"></span></div><canvas id="cv" width="440" height="380" style="width:100%;border:3px solid var(--outline);border-radius:18px;background:linear-gradient(#e9d9b0 0 70px,#a77a46 70px);touch-action:manipulation"></canvas>`;
 const cv=$('cv'),k=cv.getContext('2d'),PX=220,PY=48;let sc=0,T=60,tg,items=[],ang=0,t=0,claw=null,raf,dead=false;
 const mkItem=(w)=>{for(let g=0;g<50;g++){const x=40+Math.random()*360,y=130+Math.random()*220;if(items.every(o=>Math.hypot(o.x-x,o.y-y)>78))return{w,x,y,r:34}}return{w,x:40+Math.random()*360,y:130+Math.random()*220,r:34}};
 const newT=()=>{const cand=items.length?items[rnd(items.length)].w:CT.vocab[0];tg=cand;$('tg').textContent=tg.vn};
 const W=wordsN(7);W.forEach(w=>items.push(mkItem(w)));newT();
 const fire=()=>{if(!claw&&!dead)claw={a:ang,len:0,out:true,got:null}};cv.onclick=fire;const kd=e=>{if(e.code==='Space'){e.preventDefault();fire()}};addEventListener('keydown',kd);
 const loop=()=>{t+=.03;ang=Math.sin(t)*1.15;k.clearRect(0,0,440,380);k.fillStyle='#8a5a2b';k.fillRect(PX-26,40,52,12);
  items.forEach(o=>{k.beginPath();k.arc(o.x,o.y,o.r,0,7);k.fillStyle='#f2c230';k.fill();k.lineWidth=3;k.strokeStyle='#8a6a10';k.stroke();k.fillStyle='#3a2a00';k.font='800 '+(o.w.zh.length>=4?14:o.w.zh.length===3?18:24)+'px "Noto Serif SC",serif';k.textAlign='center';k.textBaseline='middle';k.fillText(o.w.zh,o.x,o.y)});
  const a=claw?claw.a:ang;let L=claw?claw.len:30;if(claw){if(claw.out){claw.len+=7;const hx=PX+Math.sin(claw.a)*claw.len,hy=PY+Math.cos(claw.a)*claw.len;const o=items.find(o=>Math.hypot(o.x-hx,o.y-hy)<o.r);if(o){claw.got=o;claw.out=false}else if(hx<8||hx>432||hy>372)claw.out=false}else{claw.len-=claw.got?4:9;if(claw.got){claw.got.x=PX+Math.sin(claw.a)*claw.len;claw.got.y=PY+Math.cos(claw.a)*claw.len}
   if(claw.len<=24){const o=claw.got;if(o){if(o.w.zh===tg.zh){C.beep(true);sc+=20;if(window.rwSay)rwSay(o.w.zh)}else{C.beep(false);sc=Math.max(0,sc-10)}items.splice(items.indexOf(o),1);const used=new Set(items.map(x=>x.w.zh));const pool=CT.vocab.filter(w=>!used.has(w.zh)&&!items.some(x=>x.w.vn===w.vn));const nw=pool.length?pool[rnd(pool.length)]:CT.vocab[rnd(CT.vocab.length)];items.push(mkItem(nw));newT();$('sc').textContent=sc}claw=null}}}
  const hx=PX+Math.sin(a)*L,hy=PY+Math.cos(a)*L;k.strokeStyle='#444';k.lineWidth=3;k.beginPath();k.moveTo(PX,PY);k.lineTo(hx,hy);k.stroke();if(AN.complete&&AN.naturalWidth)k.drawImage(AN,hx-19,hy-8,38,38);else{k.fillStyle='#555';k.beginPath();k.arc(hx,hy,7,0,7);k.fill()}
  if(!dead)raf=requestAnimationFrame(loop)};
 const iv=setInterval(()=>{$('tm').textContent=--T;if(T<=0){dead=true;cleanup();cleanup=()=>{};end(sc*10)}},1000);cleanup=()=>{dead=true;clearInterval(iv);cancelAnimationFrame(raf);removeEventListener('keydown',kd)};loop()}
/* 9. Cá voi bay */
function flap(R,end){R.innerHTML=`<div class="stat"><span class="pill">Điểm <b id="sc">0</b></span><span class="heart" id="hr"></span><span class="muted">Chạm vào màn hình để vỗ bay</span></div><div style="text-align:center;font:800 20px var(--f-d);min-height:54px" id="qq"></div><canvas id="cv" width="440" height="360" style="width:100%;border:3px solid var(--outline);border-radius:18px;background:linear-gradient(#bfe6f2,#6fb6d0);touch-action:manipulation"></canvas>`;
 const cv=$('cv'),k=cv.getContext('2d'),img=new Image();img.src='img/pets.webp';const pi=RWL.myPet();let y=180,vy=0,hearts=5,sc=0,q,gate,raf,dead=false,inv=120,hit=false;
 const hr=()=>$('hr').innerHTML=RWL.HEARTS(hearts,5);
 const mk=()=>{q=C.makeQ(CT);const wrong=S(q.opts.filter(o=>o!==q.ans))[0],up=Math.random()<.5;$('qq').innerHTML=E(q.prompt)+'<br><small class="muted">'+E(q.sub||'')+'</small>';gate={x:460,top:up?q.ans:wrong,bot:up?wrong:q.ans,ok:up?0:1,done:false}};
 const flapUp=()=>{vy=-5.2};cv.onclick=flapUp;const kd=e=>{if(e.code==='Space'){e.preventDefault();flapUp()}};addEventListener('keydown',kd);
 const GH=124,Y1=55,Y2=232,GW=84;
 const lose=()=>{hearts--;hr();C.beep(false);inv=70;if(hearts<=0){dead=true;cleanup();cleanup=()=>{};end(sc*10)}};
 const loop=()=>{vy+=.22;y+=vy;k.clearRect(0,0,440,360);
  if(y<12||y>348){if(inv<=0)lose();y=Math.max(30,Math.min(330,y));vy=y>200?-4:1}
  gate.x-=1.5;const gx=gate.x;
  [[Y1,gate.top],[Y2,gate.bot]].forEach(([gy,t],i)=>{k.fillStyle='rgba(15,70,90,.85)';k.fillRect(gx,i?gy+GH:0,GW,i?360-gy-GH:gy);if(!i)k.fillRect(gx,Y1+GH,GW,Y2-Y1-GH);
   k.fillStyle='#fff';k.fillRect(gx-6,gy,GW+12,GH);k.fillStyle='#0f3a46';k.font='800 '+(t.length<=4?20:t.length<=8?14:12)+'px "Noto Serif SC",Nunito,sans-serif';k.textAlign='center';k.textBaseline='middle';const cap=t.length<=4?4:8,lines=[];for(let s=0;s<t.length&&lines.length<4;s+=cap)lines.push(t.slice(s,s+cap));lines.forEach((ln,j)=>k.fillText(ln,gx+GW/2,gy+GH/2+(j-(lines.length-1)/2)*15))});
  if(img.complete){const w=70,h=w*112/190;if(inv>0&&Math.floor(inv/6)%2)k.globalAlpha=.4;k.save();k.translate(90,y);k.rotate(Math.max(-.5,Math.min(.5,vy*.06)));k.drawImage(img,pi*190,0,190,112,-w/2,-h/2,w,h);k.restore();k.globalAlpha=1}
  if(inv>0)inv--;
  if(!gate.done&&gate.x<125&&gate.x+GW>55){const inTop=y>Y1+2&&y<Y1+GH-2,inBot=y>Y2+2&&y<Y2+GH-2;if(!inTop&&!inBot&&inv<=0){gate.done=true;lose();y=gate.ok===0?Y1+GH/2:Y2+GH/2;vy=0}
   else if(gate.x+GW<95&&!gate.done){gate.done=true;const idx=inTop?0:1;if(idx===gate.ok){C.beep(true);sc++;if(window.rwSay&&q.say)rwSay(q.say);$('sc').textContent=sc*10}else{lose()}}}
  if(gate.x<-GW-10){mk()}
  if(!dead)raf=requestAnimationFrame(loop)};
 hr();mk();cleanup=()=>{dead=true;cancelAnimationFrame(raf);removeEventListener('keydown',kd)};loop()}
home();
