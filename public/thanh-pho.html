 const go=async()=>{const n=$('gn').value.trim(),e=$('ge').value.trim().toLowerCase(),er=$('gerr');if(!n){er.textContent='Hãy nhập tên của bạn.';return}if(!EMAILRE.test(e)){er.textContent='Email chưa đúng, kiểm tra lại nhé.';return}
