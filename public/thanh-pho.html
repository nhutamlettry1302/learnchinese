function loginM(){modal(`<h2>Vào lớp</h2><p class="sub">Nhập tên và mã lớp cô cho để điểm EXP vào bảng xếp hạng.</p><input id="in1" placeholder="Tên của bạn" maxlength="24" value="${esc((me&&me.name)||ST.name)}"><input id="in2" placeholder="Mã lớp" maxlength="20" autocapitalize="characters" value="${me?esc(me.code):''}"><div class="err" id="er"></div><div class="row"><button class="btn gold" id="go">Vào lớp</button><button class="btn" id="cl">Đóng</button></div>`);
 $('cl').onclick=closeM;$('go').onclick=async()=>{const n=$('in1').value.trim(),c=$('in2').value.trim().toUpperCase();if(!n||!c){$('er').textContent='Hãy nhập đủ tên và mã lớp.';return}
  try{const name=await rpc('check_class',{p_code:c});if(!name){$('er').textContent='Mã lớp không đúng.';return}me={name:n,code:c,cls:name};ST.name=n;saveState();try{localStorage.setItem('rw_me',JSON.stringify(me))}catch(e){}closeM();postScore();toast('Đã vào lớp '+name)}catch(e){$('er').textContent='Chưa kết nối được. Thử lại sau nhé.'}}}
async function showLb(){if(!ON)return toast('Bảng xếp hạng chưa được bật');if(!me)return loginM();modal(`<h2>Xếp hạng ${esc(me.cls)}</h2><p class="sub">Đang tải…</p>`);let r=null;try{r=await rpc('leaderboard',{p_game:'thanh-pho',p_code:me.code,p_limit:10})}catch(e){}
 const med=['🥇','🥈','🥉'];modal(`<h2>Xếp hạng ${esc(me.cls)}</h2><p class="sub">Xếp theo tổng EXP</p>${r&&r.length?'<ol class="lbo">'+r.map((x,i)=>`<li class="${x.player.toLowerCase()===me.name.toLowerCase()?'me':''}">${med[i]||(i+1)+'.'} ${esc(x.player)} · <b>${x.best}</b></li>`).join('')+'</ol>':'<p class="sub">Chưa có ai trong bảng, bạn có thể là người đầu tiên!</p>'}<div class="row"><button class="btn" id="cl">Đóng</button></div>`);$('cl').onclick=closeM}
async function postScore(){if(!ON||!me||!ST.exp)return;try{await rpc('submit_score',{p_game:'thanh-pho',p_code:me.code,p_player:me.name,p_score:ST.exp})}catch(e){}}
function openMenu(){modal(`<h2>Menu</h2><div class="menu"><button class="btn" data-m="profile">🧑 Hồ sơ và skin</button><button class="btn" data-m="level">📚 Chọn cấp và bài</button><button class="btn" data-m="wheel">🎡 Vòng quay (${ST.tickets||0})</button><button class="btn" data-m="home">🏠 Nhà của tôi</button><button class="btn" data-m="shop">🛍️ Cửa hàng</button><button class="btn" data-m="lb">🏆 Xếp hạng lớp</button><button class="btn" data-m="class">👤 ${me?'Lớp: '+esc(me.cls):'Vào lớp'}</button><button class="btn" data-m="night">🌙 Ngày / đêm</button><button class="btn" data-m="help">❓ Cách chơi</button><a class="btn" href="index.html#tro-choi">🌲 Về Rừng Cá Voi</a></div><div class="row"><button class="btn" id="cl">Đóng</button></div>`);
 $('cl').onclick=closeM;$('pm').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=b.dataset.m;if(m==='profile')openProfile(false);else if(m==='level')openLevel(false);else if(m==='wheel')openWheel();else if(m==='home')openHome('inv');else if(m==='shop')openHome('shop');else if(m==='lb')showLb();else if(m==='class')loginM();else if(m==='night'){closeM();$('bN').click()}else if(m==='help')openHelp()})}
function openHelp(){modal(`<h2>Cách chơi</h2><p style="text-align:left">Bấm đường để đi bộ, bấm tòa nhà để vào và chọn <b>Bắt đầu nhiệm vụ</b> (6 câu từ vựng của cấp và bài bạn chọn).</p><p style="text-align:left">Trả lời đúng được <b>EXP</b> và <b>xu 🪙</b>. Lên cấp được 1 vé <b>vòng quay 🎡</b> và mở <b>skin mới</b>. Dùng xu mua đồ ở <b>Cửa hàng</b> để trang trí <b>nhà của bạn</b> (ngôi nhà có biển "Nhà của bạn" trong thành phố).</p><div class="row"><button class="btn gold" id="cl">Đi dạo thôi!</button></div>`);$('cl').onclick=closeM}
$('bMenu').onclick=openMenu;$('bLvl').onclick=()=>openLevel(false);$('bHome').onclick=()=>openHome('inv');$('bWheel').onclick=openWheel;
addEventListener('keydown',e=>{if(e.key==='Escape'){Q=null;$('ovq').classList.remove('on');closeM()}});
/* ---------- Khởi động: tên, skin, cấp, bài ---------- */
function startFlow(){if(ST.done)return;openProfile(true,()=>openLevel(true,()=>{ST.done=true;saveState();toast('Chào '+ST.name+'! Bấm vào tòa nhà có dấu ! để bắt đầu')}))}
syncUnlocks();syncProg();refreshHud();fit();setTimeout(startFlow,350);requestAnimationFrame(frame);
window.__tp={P,PLACES,walkTo,NODES,openQ,openPlace,enterRoom,NPC,drawPerson,stepNpc,get Q(){return Q},get ST(){return ST},openHome,openWheel,awardWheel,get prog(){return prog},get S(){return S},CAM};
</script></body></html>
