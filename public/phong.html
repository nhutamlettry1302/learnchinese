<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phòng học của giáo viên – Rừng Cá Voi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&family=Noto+Serif+SC:wght@600;800&display=swap">
<link rel="stylesheet" href="rwlive.css">
<script>try{var t=localStorage.getItem('rw_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>.pickbox{border:2px dashed var(--outline);border-radius:16px;padding:12px;margin:10px 0}.tabs{display:flex;gap:8px;margin-bottom:6px}.tabs .btn{box-shadow:none}.res{width:100%;border-collapse:collapse;font-size:15px}.res td,.res th{padding:6px 8px;border-bottom:1px dotted var(--outline);text-align:left}.whh{display:flex;align-items:center;gap:12px;margin-bottom:6px}.whi{display:block;margin:-2px auto 2px;height:40px}.st .whi svg{height:38px;width:auto}.whbars{display:flex;align-items:flex-end;gap:5px;height:76px;margin-top:10px}.whbars div{flex:1;text-align:center}.whbars i{display:block;border-radius:8px 8px 3px 3px;background:linear-gradient(#a9cfcb,#7cc6c0);border:1.5px solid #c4a46a}.whbars small{font-size:10px;color:#8a6a2f}
</style>
<link rel="stylesheet" href="phong-theme.css"><link rel="stylesheet" href="adventure.css"><style>.top .brand:before{content:none!important}</style></head><body class="rooms-page"><div class="wrap">
<div class="top"><a class="btn sm" href="index.html">← Trang chủ</a><span class="brand"><span id="brandWh" style="display:inline-flex;vertical-align:middle;margin-right:10px"></span>Phòng học của giáo viên</span><span class="sp"></span><span id="who" class="muted"></span></div>
<section class="host-title"><div><div class="eyebrow">KHÔNG GIAN GIÁO VIÊN</div><h1>Phòng học của bạn</h1><p class="muted">Chọn nội dung, gửi mã cho học sinh và cùng cả lớp bắt đầu.</p></div></section><div id="main"></div></div>
<script src="config.js"></script><script src="whales.js"></script><script>document.addEventListener("DOMContentLoaded",function(){var e=document.getElementById("brandWh");if(e&&window.RWH)e.innerHTML=RWH("none",56)})</script><script src="audio.js"></script><script src="rwcore.js"></script><script src="vatpham.js?v=20261109b"></script><script src="cua-hang.js?v=20261109b"></script><script src="cong-cu.js?v=20261109b"></script>
<script>
const C=RWC,A=C.Auth,$=id=>document.getElementById(id),E=C.esc;
let hasOwner=true,page='mine',users=[],allRooms=[],myScores=null,rooms=[],edit=null,msg='',err='',tab='vocab',lvSel={vocab:'HSK1',gram:'HSK1'},mode='in',open=null,results={};
const say=(m,e)=>{msg=m||'';err=e||'';render()};
const sumSel=cfg=>{const n=o=>Object.values(o||{}).reduce((a,l)=>a+l.length,0);return n(cfg.vocab)+' bài từ vựng · '+n(cfg.gram)+' bài ngữ pháp'};
const joinLink=c=>new URL('live.html?phong='+c,location.href).href;
function authCard(){return`<div class="card" style="max-width:460px;margin:20px auto"><h2>${mode==='in'?'Đăng nhập':'Tạo tài khoản'}</h2><p class="muted">Đăng nhập để tạo phòng học và theo dõi học sinh. Học sinh vào chơi bằng mã phòng, không cần đăng nhập.</p>
 ${mode==='up'?'<label>Tên hiển thị</label><input id="an" maxlength="40">':''}<label>Email</label><input id="ae" type="email" autocomplete="email"><label>Mật khẩu (từ 6 ký tự)</label><input id="ap" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}">
 <p class="err">${E(err)}</p><p class="ok">${E(msg)}</p><div class="row"><button class="btn pri" id="ago">${mode==='in'?'Đăng nhập':'Tạo tài khoản'}</button><button class="btn sm" id="asw">${mode==='in'?'Chưa có tài khoản?':'Đã có tài khoản?'}</button></div></div>`}
function teacherGate(){const sc=myScores;const G={'live-quiz':'Đấu trường','live-race':'Đua cá voi / xe / tên lửa','live-coop':'Hợp sức (trùm, tháp)','live-tug':'Kéo co','solo-whack':'Đập chuột chũi','solo-listen':'Nghe và chọn','solo-hang':'Đoán pinyin','solo-seq':'Trí nhớ chuỗi','solo-car':'Đua xe','solo-type':'Gõ pinyin','solo-tf':'Đúng hay sai','solo-pairs':'Nối cặp','solo-flip':'Lật thẻ','solo-mil':'Ai là triệu phú','solo-bub':'Bong bóng chữ','solo-fall':'Mưa chữ','solo-snake':'Thang và rắn'};
 return`<div class="card" style="max-width:560px;margin:20px auto"><h2>Xin chào ${E(A.profile&&A.profile.name||'')} 👋</h2><p class="muted">Bạn đang đăng nhập với vai trò <b>học sinh</b>. Muốn vào phòng học, hãy nhập mã do giáo viên gửi.</p>
 <div class="row"><a class="btn pri" href="live.html">Vào phòng bằng mã</a><button class="btn sm" id="out">Đăng xuất</button></div></div>
 <div class="card" style="max-width:560px;margin:14px auto"><h3>Điểm của tôi</h3>${sc?(sc.length?`<table class="res"><tr><th>Phòng</th><th>Trò</th><th>Cao nhất</th><th>Lượt</th></tr>${sc.map(x=>`<tr><td>${E(x.room||x.code)}</td><td>${E(G[x.game]||x.game)}</td><td>${x.best}</td><td>${x.plays}</td></tr>`).join('')}</table>`:'<p class="muted">Chưa có điểm. Khi vào phòng lúc đã đăng nhập, điểm sẽ lưu vào đây.</p>'):'<p class="muted">Đang tải…</p>'}</div>
${hasOwner?'':`<div class="card" style="max-width:560px;margin:14px auto"><h3>Chủ web</h3><p class="muted">Web chưa có chủ web. Nếu bạn là cô Roxie, nhập mật khẩu giáo viên rồi bấm nhận quyền chủ web (chỉ làm được một lần).</p><label>Mật khẩu giáo viên</label><input id="op" type="password"><p class="err">${E(err)}</p><button class="btn gold" id="ogo">Nhận quyền chủ web</button></div>`}
 <div class="card" style="max-width:560px;margin:14px auto"><h3>Dành cho giáo viên</h3><p class="muted">Nhập mật khẩu giáo viên (cô Roxie cung cấp) để mở tính năng tạo phòng.</p>
 <label>Mật khẩu giáo viên</label><input id="tp" type="password"><p class="err">${E(err)}</p><button class="btn pri" id="tgo">Mở quyền giáo viên</button></div>`}
/* quản trị (chủ web) */
let uq='',uf='all';
const RL={owner:'Chủ web',teacher:'Giáo viên',student:'Học sinh'};
const ini=u=>(String(u.name||u.email||'?').trim().split(/\s+/).pop()||'?').charAt(0).toUpperCase();
function userRows(){const q=uq.trim().toLowerCase();const L=users.filter(u=>(uf==='all'||u.role===uf)&&(!q||(u.name||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q)));
 if(!L.length)return'<div class="empty">Không có người dùng phù hợp.</div>';
 return L.map(u=>`<div class="urow"><span class="av r-${u.role}">${E(ini(u))}</span><div class="ui"><b>${E(u.name||'(chưa đặt tên)')}</b><small>${E(u.email||'')}</small></div><span class="muted rc">${u.rooms?u.rooms+' phòng':''}</span>${u.role==='owner'?'<span class="rp r-owner">👑 Chủ web</span>':`<div class="seg" role="group" aria-label="Vai trò"><button data-role="${u.id}" data-v="student" class="${u.role==='student'?'on':''}">Học sinh</button><button data-role="${u.id}" data-v="teacher" class="${u.role==='teacher'?'on':''}">Giáo viên</button></div>`}</div>`).join('')}
function tile(ic,n,l){return`<div class="st"><span class="whi">${RWH(ic,54)}</span><b>${n}</b><span>${l}</span></div>`}
function visitCard(){const hd=`<div class="whh">${RWH('chart',64)}<div><h3 style="margin:0">Lượt truy cập web</h3><p class="muted" style="margin:0">Mỗi máy tính 1 lượt mỗi ngày</p></div></div>`;
 if(!vstats)return verr?`<div class="card">${hd}<p class="err">${E(verr)}</p></div>`:'';const v=vstats,mx=Math.max(1,...v.days.map(x=>x.n));
 return`<div class="card">${hd}<div class="stats">${tile('calendar',v.today,'Hôm nay')}${tile('clock',v.week,'7 ngày')}${tile('star',v.month,'30 ngày')}${tile('globe',v.unique,'Máy khác nhau')}</div>
 <div class="whbars">${v.days.map(x=>`<div title="${E(x.d)}: ${x.n}"><i style="height:${Math.max(4,Math.round(x.n/mx*56))}px"></i><small>${E(String(x.d).slice(8,10))}</small></div>`).join('')}</div>
 <p class="muted" style="font-size:12px;margin:2px 0 8px">14 ngày gần nhất</p>
 ${v.pages&&v.pages.length?'<p class="muted" style="margin:0">Trang được xem nhiều (30 ngày): '+v.pages.map(p=>E(p.p)+' <b>'+p.n+'</b>').join(' · ')+'</p>':''}</div>`}
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<1?'vừa xong':m<60?m+' phút trước':m<1440?Math.round(m/60)+' giờ trước':Math.round(m/1440)+' ngày trước'};
function cityRows(){const q=cq.trim().toLowerCase();const L=(cityL||[]).filter(u=>!q||u.player.toLowerCase().includes(q)||u.email.toLowerCase().includes(q));
 if(!L.length)return'<div class="empty">Chưa có người chơi phù hợp.</div>';
 return L.map((u,i)=>`<div class="urow"><span class="av">${i+1}</span><div class="ui"><b>${E(u.player)}</b><small>${E(u.email)}</small></div><span class="muted rc">Cấp ${u.level} · ${u.exp} EXP · ${u.stars}★ · ${u.places} nơi${u.extra&&u.extra.worldQuests?' · '+u.extra.worldQuests+' NV quốc gia':''}<br>Chơi ${ago(u.updated_at)}</span><button class="btn sm" data-cdel="${E(u.email)}">Xóa</button></div>`).join('')}
function cityCard(){const hd=`<div class="whh">${RWH('trophy',64)}<div><h3 style="margin:0">Người chơi Thành phố Cá Voi</h3><p class="muted" style="margin:0">Mỗi người đăng nhập bằng email và tên</p></div></div>`;
 if(!cityL)return cityErr?`<div class="card">${hd}<p class="err">${E(cityErr)}</p></div>`:'';
 const day=Date.now()-864e5,wk=Date.now()-7*864e5,act=t=>cityL.filter(u=>new Date(u.updated_at)>t).length,avg=cityL.length?Math.round(cityL.reduce((a,u)=>a+u.level,0)/cityL.length*10)/10:0;
 return`<div class="card">${hd}<div class="stats">${tile('hanzi',cityL.length,'Người chơi')}${tile('fire',act(day),'Chơi 24 giờ qua')}${tile('target',act(wk),'Chơi 7 ngày qua')}${tile('trophy',avg,'Cấp trung bình')}</div>
 <div class="tool"><input id="cq" type="search" placeholder="🔍 Tìm tên hoặc email" value="${E(cq)}"></div><div id="clist">${cityRows()}</div><p class="muted" style="font-size:12px">Xóa người chơi chỉ xóa hồ sơ trên máy chủ. Nếu bạn ấy chơi lại thì hồ sơ được tạo lại từ dữ liệu trên máy của bạn ấy.</p></div>`}
function adminView(){const n=r=>users.filter(u=>u.role===r).length;
 return`${msg?`<p class="ok">${E(msg)}</p>`:''}${err?`<p class="err">${E(err)}</p>`:''}
 <div class="stats"><div class="st"><b>${users.length}</b><span>Tài khoản</span></div><div class="st"><b>${n('teacher')+n('owner')}</b><span>Giáo viên</span></div><div class="st"><b>${n('student')}</b><span>Học sinh</span></div><div class="st"><b>${allRooms.length}</b><span>Phòng học</span></div></div>
${visitCard()}${cityCard()}
 <div class="card"><h3 style="margin:0 0 4px">Phân quyền người dùng</h3><p class="muted" style="margin:0 0 10px">Người mới đăng ký mặc định là <b>Học sinh</b>. Chọn <b>Giáo viên</b> để họ được tạo phòng và mở lớp học trực tiếp.</p>
 <div class="tool"><input id="uq" type="search" placeholder="🔍 Tìm theo tên hoặc email" value="${E(uq)}"><div class="fil">${[['all','Tất cả'],['teacher','Giáo viên'],['student','Học sinh']].map(f=>`<button data-uf="${f[0]}" class="${uf===f[0]?'on':''}">${f[1]}</button>`).join('')}</div></div>
 <div id="ulist">${userRows()}</div></div>
 <div class="card"><h3 style="margin:0 0 8px">Tất cả phòng học</h3>${allRooms.length?allRooms.map(r=>`<div class="urow"><span class="code-sm">${r.code}</span><div class="ui"><b>${E(r.name)}</b><small>Giáo viên: ${E(r.teacher||'—')} · ${r.plays} lượt chơi${r.closed?' · đã đóng':''}</small></div><button class="btn sm" data-adel="${r.code}" title="Xóa phòng">🗑 Xóa</button></div>`).join(''):'<div class="empty">Chưa có phòng nào.</div>'}</div>`}
/* chọn bài */
function picker(sel){const L=tab==='vocab'?C.Data.vocabLevels():C.Data.gramLevels(),cur=L.find(l=>l.k===lvSel[tab])||L[0],S=sel[tab];S[cur.k]=S[cur.k]||[];
 const on=n=>S[cur.k].includes(n);const tot=Object.values(S).reduce((a,x)=>a+x.length,0);
 return`<div class="pickbox"><div class="tabs"><button class="btn sm ${tab==='vocab'?'pri':''}" data-tab="vocab">Từ vựng</button><button class="btn sm ${tab==='gram'?'pri':''}" data-tab="gram">Ngữ pháp</button><span style="flex:1"></span><span class="muted">Đã chọn: ${sumSel(sel)}</span></div>
 <div class="pick-lv">${L.map(l=>`<span class="pk ${l.k===cur.k?'on':''}" data-lv="${E(l.k)}">${E(l.n)}${(S[l.k]||[]).length?' ('+S[l.k].length+')':''}</span>`).join('')}</div>
 <div class="row" style="margin:6px 0"><button class="btn sm" data-all="1">Chọn hết ${E(cur.n)}</button><button class="btn sm" data-none="1">Bỏ hết</button></div>
 <div class="pick-ls">${cur.ls.map(x=>`<span class="pk ${on(x.n)?'on':''}" data-ls="${x.n}" title="${E(x.t||'')}">Bài ${x.n}${x.t?' · '+E(String(x.t).slice(0,18)):''}</span>`).join('')}</div></div>`}
function roomForm(){const r=edit;return`<div class="card"><h2>${r.code?'Sửa phòng '+r.code:'Tạo phòng mới'}</h2><label>Tên phòng (ví dụ: HSK3 tối T3 T5)</label><input id="rn" value="${E(r.name)}" maxlength="60">${picker(r.config)}
 <p class="err">${E(err)}</p><div class="row"><button class="btn pri" id="rsave">${r.code?'Lưu':'Tạo phòng'}</button><button class="btn" id="rcancel">Hủy</button></div></div>`}
function roomCard(r){const op=open===r.code,res=results[r.code];
 return`<div class="card room-card"><div class="room-top"><div style="flex:1;min-width:200px"><h3>${E(r.name)}${r.closed?' <span class="chip">đã đóng</span>':''}</h3><div class="muted">${sumSel(r.config)} · ${r.plays} lượt chơi</div></div><div class="code" style="font-size:44px">${r.code}</div></div>
 <div class="room-actions"><a class="btn pri" href="live-host.html?phong=${r.code}">▶ Mở lớp học trực tiếp</a><button class="btn sm" data-cp="${r.code}">📋 Chép link học sinh</button><button class="btn sm" data-ed="${r.code}">✏️ Sửa bài</button><button class="btn sm" data-rs="${r.code}">📊 Kết quả</button><button class="btn sm" data-cl="${r.code}">${r.closed?'Mở lại':'Đóng phòng'}</button><button class="btn sm" data-del="${r.code}">🗑</button></div>
 ${op?(res?(res.length?`<div style="overflow-x:auto;margin-top:10px"><table class="res"><tr><th>Học sinh</th><th>Trò</th><th>Điểm cao nhất</th><th>Lượt</th></tr>${res.map(x=>`<tr><td>${E(x.player)}</td><td>${E(({'live-quiz':'Đấu trường','live-race':'Đua cá voi / xe / tên lửa','live-coop':'Hợp sức (trùm, tháp)','live-tug':'Kéo co','solo-whack':'Đập chuột chũi','solo-listen':'Nghe và chọn','solo-hang':'Đoán pinyin','solo-seq':'Trí nhớ chuỗi','solo-car':'Đua xe','solo-type':'Gõ pinyin','solo-tf':'Đúng hay sai','solo-pairs':'Nối cặp','solo-flip':'Lật thẻ','solo-mil':'Ai là triệu phú','solo-bub':'Bong bóng chữ','solo-fall':'Mưa chữ','solo-snake':'Thang và rắn'})[x.game]||x.game)}</td><td>${x.best}</td><td>${x.plays}</td></tr>`).join('')}</table></div>`:'<p class="muted">Chưa có kết quả.</p>'):'<p class="muted">Đang tải…</p>'):''}</div>`}
const TABS=()=>`<div class="tabs"><button class="btn sm ${page==='mine'?'pri':''}" data-pg="mine">Phòng của tôi</button><button class="btn sm ${page==='tools'?'pri':''}" data-pg="tools">🛠 Công cụ giảng dạy</button>${A.profile.role==='owner'?`<button class="btn sm ${page==='admin'?'pri':''}" data-pg="admin">Quản trị (chủ web)</button>`:''}</div>`;
function render(){const M=$('main');$('who').innerHTML=A.loggedIn?E((A.profile&&A.profile.name)||A.user&&A.user.email||'')+(A.profile&&A.profile.role==='owner'?' (chủ web)':A.profile&&A.profile.role==='teacher'?' (giáo viên)':'')+' · <a href="#" id="out2">Đăng xuất</a>':'';
 if(!A.loggedIn){M.innerHTML=authCard()}else if(!A.profile){M.innerHTML='<p class="muted">Đang tải hồ sơ…</p>'}else if(A.profile.role==='student'){M.innerHTML=teacherGate()}
 else if(edit){M.innerHTML=roomForm()}
 else if(page==='tools'){M.innerHTML=TABS()+TT.html()}
 else if(A.profile.role==='owner'&&page==='admin'){M.innerHTML=TABS()+adminView()}
 else{M.innerHTML=`${TABS()}${msg?`<p class="ok">${E(msg)}</p>`:''}${err?`<p class="err">${E(err)}</p>`:''}<div class="row"><button class="btn pri" id="newr">＋ Tạo phòng mới</button></div>${rooms.length?rooms.map(roomCard).join(''):'<div class="card"><h3>Chưa có phòng nào</h3><p class="muted">Bấm "Tạo phòng mới", chọn bài từ vựng và ngữ pháp cho lớp, rồi gửi mã phòng cho học sinh. Học sinh vào bằng điện thoại, không cần đăng nhập.</p></div>'}`}
 wire()}
const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
async function load(){try{rooms=(await C.rpc('my_rooms'))||[]}catch(e){err='Chưa tải được danh sách phòng. Bạn đã chạy file phong-hoc.sql trong Supabase chưa? ('+e.message+')'}render()}
let vstats=null,verr='',cityL=null,cityErr='',cq='';async function loadAdmin(){try{users=await C.rpc('admin_users')||[];allRooms=await C.rpc('admin_rooms')||[]}catch(e){err=e.message}try{vstats=await C.rpc('visit_stats');verr=''}catch(e){vstats=null;verr='Chưa bật đếm lượt truy cập: hãy chạy file luot-truy-cap.sql trong Supabase.'}try{cityL=await C.rpc('admin_city_list')||[];cityErr=''}catch(e){cityL=null;cityErr='Chưa bật quản lý người chơi: hãy chạy file thanh-pho-nguoi-choi.sql trong Supabase.'}render()}
function wire(){
 if(page==='tools')TT.wire();
 document.querySelectorAll('[data-pg]').forEach(b=>b.onclick=async()=>{page=b.dataset.pg;err='';msg='';render();if(page==='admin')await loadAdmin()});
 document.querySelectorAll('[data-role]').forEach(b=>b.onclick=async()=>{if(b.classList.contains('on'))return;const u=users.find(x=>x.id===b.dataset.role),v=b.dataset.v;if(!confirm(v==='teacher'?'Cấp quyền giáo viên cho '+(u.name||u.email)+'?':'Chuyển '+(u.name||u.email)+' về học sinh? Họ sẽ không tạo được phòng mới.'))return;try{await C.rpc('admin_set_role',{p_id:u.id,p_role:v});say('Đã cập nhật: '+(u.name||u.email)+' → '+RL[v]);await loadAdmin()}catch(e){say('',e.message)}});
 document.querySelectorAll('[data-uf]').forEach(b=>b.onclick=()=>{uf=b.dataset.uf;render()});
 const cqi=$('cq');if(cqi)cqi.oninput=()=>{cq=cqi.value;$('clist').innerHTML=cityRows();wireC()};const wireC=()=>document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=async()=>{if(!confirm('Xóa người chơi '+b.dataset.cdel+' khỏi bảng xếp hạng?'))return;try{await C.rpc('admin_city_delete',{p_email:b.dataset.cdel});say('Đã xóa người chơi.');await loadAdmin()}catch(e){say('',e.message)}});wireC();
 const qi=$('uq');if(qi)qi.oninput=()=>{uq=qi.value;$('ulist').innerHTML=userRows();wire()};
 document.querySelectorAll('[data-adel]').forEach(b=>b.onclick=async()=>{if(!confirm('Xóa phòng '+b.dataset.adel+' cùng điểm của phòng?'))return;try{await C.rpc('admin_room_delete',{p_code:b.dataset.adel});say('Đã xóa phòng.');await loadAdmin()}catch(e){say('',e.message)}});
 on('asw',()=>{mode=mode==='in'?'up':'in';err='';msg='';render()});
 on('ago',async()=>{const em=$('ae').value.trim(),pw=$('ap').value,nm=$('an')?$('an').value.trim():'';err='';msg='';if(!em||pw.length<6){say('','Nhập email và mật khẩu (từ 6 ký tự).');return}
  try{if(mode==='in')await A.signIn(em,pw);else{const r=await A.signUp(em,pw,nm);if(r.confirm){say('Đã tạo tài khoản. Hãy mở email để bấm xác nhận, rồi quay lại đăng nhập.');mode='in';return}}await boot()}catch(e){say('',e.message)}});
 on('ogo',async()=>{try{await C.rpc('rw_claim_owner',{p_pass:$('op').value});err='';hasOwner=true;await boot()}catch(e){say('',/mat khau/.test(e.message)?'Mật khẩu chưa đúng.':e.message)}});
 on('tgo',async()=>{try{await A.becomeTeacher($('tp').value);err='';await boot()}catch(e){say('','Mật khẩu giáo viên chưa đúng.')}});
 on('out',()=>{A.signOut();render()});on('out2',e=>{A.signOut();location.reload()});const o2=$('out2');if(o2)o2.onclick=e=>{e.preventDefault();A.signOut();location.reload()};
 on('newr',()=>{edit={code:'',name:'',config:{vocab:{},gram:{}}};err='';msg='';render()});
 on('rcancel',()=>{edit=null;err='';render()});
 on('rsave',async()=>{const r=edit;r.name=$('rn').value.trim();const n=o=>Object.values(o).reduce((a,l)=>a+l.length,0);if(!r.name){err='Hãy đặt tên phòng.';return render()}if(n(r.config.vocab)+n(r.config.gram)===0){err='Hãy chọn ít nhất một bài.';return render()}
  const clean={};['vocab','gram'].forEach(k=>{clean[k]={};Object.keys(r.config[k]).forEach(l=>{if(r.config[k][l].length)clean[k][l]=r.config[k][l].slice().sort((a,b)=>a-b)})});
  try{if(r.code){await C.rpc('room_update',{p_code:r.code,p_name:r.name,p_config:clean,p_closed:null});say('Đã lưu phòng.')}else{const c=await C.rpc('room_create',{p_name:r.name,p_config:clean});say('Đã tạo phòng. Mã phòng: '+c)}edit=null;await load()}catch(e){err=e.message;render()}});
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{lvSel[tab]=b.dataset.lv;render()});
 document.querySelectorAll('[data-ls]').forEach(b=>b.onclick=()=>{const S=edit.config[tab],k=lvSel[tab],n=+b.dataset.ls;S[k]=S[k]||[];const i=S[k].indexOf(n);i>=0?S[k].splice(i,1):S[k].push(n);render()});
 document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{const L=(tab==='vocab'?C.Data.vocabLevels():C.Data.gramLevels()).find(l=>l.k===lvSel[tab]);edit.config[tab][L.k]=L.ls.map(x=>x.n);render()});
 document.querySelectorAll('[data-none]').forEach(b=>b.onclick=()=>{edit.config[tab][lvSel[tab]]=[];render()});
 document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=async()=>{const u=joinLink(b.dataset.cp);try{await navigator.clipboard.writeText(u);say('Đã chép link: '+u)}catch(e){say('Link cho học sinh: '+u)}});
 document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const r=rooms.find(x=>x.code===b.dataset.ed);edit={code:r.code,name:r.name,config:JSON.parse(JSON.stringify({vocab:r.config.vocab||{},gram:r.config.gram||{}}))};err='';msg='';render()});
 document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{const c=b.dataset.rs;if(open===c){open=null;return render()}open=c;results[c]=null;render();try{results[c]=await C.rpc('room_results',{p_code:c})}catch(e){results[c]=[]}render()});
 document.querySelectorAll('[data-cl]').forEach(b=>b.onclick=async()=>{const r=rooms.find(x=>x.code===b.dataset.cl);try{await C.rpc('room_update',{p_code:r.code,p_name:null,p_config:null,p_closed:!r.closed});await load()}catch(e){say('',e.message)}});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const r=rooms.find(x=>x.code===b.dataset.del);if(!confirm('Xóa phòng "'+r.name+'" cùng toàn bộ điểm của phòng? Không thể khôi phục.'))return;try{await C.rpc('room_delete',{p_code:r.code});say('Đã xóa phòng.');await load()}catch(e){say('',e.message)}})}
async function boot(){render();if(A.loggedIn){await A.refresh();render();if(A.profile&&A.profile.role==='student'){try{myScores=await C.rpc('my_scores')||[]}catch(e){myScores=[]}try{hasOwner=!!(await C.rpc('rw_has_owner'))}catch(e){hasOwner=true}render()}if(A.profile&&(A.profile.role==='teacher'||A.profile.role==='owner')){await C.Data.need(true,true);await load()}}}
boot();
</script><script src="visits.js" defer></script><script src="copyright.js"></script></body></html>
