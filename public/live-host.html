<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lớp học trực tiếp – Cô điều khiển</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&family=Noto+Serif+SC:wght@600;800&display=swap">
<link rel="stylesheet" href="rwlive.css">
<script>try{var t=localStorage.getItem('rw_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head><body><div class="wrap">
<div class="top"><a class="btn sm" href="phong.html">← Phòng của cô</a><span class="brand">🐋 Lớp học trực tiếp</span><span class="sp"></span><span class="muted" id="cnt"></span></div>
<div id="main"><p class="muted">Đang kết nối…</p></div></div>
<script src="config.js"></script><script src="audio.js"></script><script src="rwcore.js"></script><script src="rwlive.js"></script>
<script>
const C=RWC,$=id=>document.getElementById(id),E=C.esc;
const code=(new URLSearchParams(location.search).get('phong')||'').toUpperCase();
const H={room:null,content:null,P:{},mode:'lobby',game:'quiz',ph:'lobby',i:0,n:20,dur:15,qs:[],t0:0,log:[],showAns:false,teams:false,gift:true,gifts:{},goal:25,rdur:240,counts:[],res:{},rank:[],tick:0,link:null};
const playerUrl=()=>new URL('live.html?phong='+code+(RWL.MOCK?'&mock=1':''),location.href).href;
const act=()=>Object.values(H.P).filter(p=>Date.now()-p.seen<12000);
const board=()=>act().concat(Object.values(H.P).filter(p=>Date.now()-p.seen>=12000&&p.score>0)).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'vi'));
function snap(){const s={t:'st',m:H.game,ph:H.ph,np:act().length,tm:{},teams:H.teams};act().forEach(p=>{s.tm[p.id]=p.team});
 const now=Date.now();
 if(H.ph==='lobby'){return s}
 if(H.game==='quiz'){const q=H.qs[H.i];s.i=H.i;s.n=H.n;s.dur=H.dur;s.left=Math.max(0,H.dur-(now-H.t0)/1000);s.q={prompt:q.prompt,sub:q.sub,opts:q.opts,zh:!!q.zh};
  s.na=act().filter(p=>p.a[H.i]!==undefined).length;
  s.gf=H.gift;if(H.ph==='rv'){s.ans=q.ans;s.counts=H.counts;s.res=H.res;s.gifts=H.gifts}
  s.top=board().slice(0,8).map(p=>[p.id,p.name,p.score,p.team]);if(H.teams)s.ts=teamScores();
  if(H.ph==='end')s.rank=board().slice(0,60).map(p=>[p.id,p.name,p.score,p.team])}
 else{s.goal=H.goal;s.left=Math.max(0,H.rdur-(now-H.t0)/1000);s.dur=H.rdur;s.bd=act().sort((a,b)=>b.steps-a.steps).slice(0,16).map(p=>[p.id,p.name,p.steps,p.team,p.pet]);if(H.teams)s.ts=teamScores('steps');
  if(H.ph==='end')s.rank=Object.values(H.P).sort((a,b)=>b.steps-a.steps||a.no-b.no).slice(0,60).map(p=>[p.id,p.name,p.steps,p.team])}
 return s}
const tileHtml=()=>{const T=RWL.tiles(code,H.goal);return Object.keys(T).map(p=>`<span class="tile" style="left:calc(${p/H.goal*100}% * .86)">${RWL.KIND[T[p]].ic}</span>`).join('')};
const rankCard=()=>{const R=Object.values(H.P).filter(p=>p.seen).sort((a,b)=>b.steps-a.steps||a.no-b.no).slice(0,12).map(p=>[p.id,p.name,p.steps,p.team]);return`<div style="margin-top:12px"><h4 style="margin:0 0 4px;font:800 16px var(--f-d)">🏆 Bảng xếp hạng</h4>${R.length?rankHtml(R,H.game==='tug'?' điểm':' bước'):'<p class="muted">Chưa có ai.</p>'}</div>`};
const qPanel=()=>{const L=act().filter(p=>p.cur).sort((a,b)=>a.name<b.name?-1:1).slice(0,8);return`<div class="qp"><div><h4>📖 Câu các bạn đang làm</h4>${L.length?L.map(p=>`<div class="qc">${RWL.petHtml(p.pet,30)}<b>${E(p.name)}</b><span>${E(p.cur)}</span></div>`).join(''):'<p class="muted">Chưa có câu nào.</p>'}</div><div><h4>📝 Vừa trả lời <button class="btn sm" id="sa" style="float:right">${H.showAns?'🙈 Ẩn đáp án':'👁 Hiện đáp án'}</button></h4>${H.log.length?H.log.map(x=>`<div class="qc ${x.ok?'ok':'no'}"><b>${x.ok?'✔':'✘'} ${E(x.n)}</b><span>${E(x.p)}${H.showAns?' → <b>'+E(x.a)+'</b>':''}</span></div>`).join(''):'<p class="muted">Chưa có ai trả lời.</p>'}</div></div>`};
const teamScores=(k)=>{const t=[0,0];Object.values(H.P).forEach(p=>{t[p.team]+=(k==='steps'?p.steps:p.score)});return t};
let conn=null;const send=()=>{if(conn)conn.send(snap())};
function onMsg(m){if(!m||!m.id)return;let p=H.P[m.id];
 if(m.t==='join'){const cnt=[0,0];Object.values(H.P).forEach(x=>cnt[x.team]++);if(!p)p=H.P[m.id]={id:m.id,name:String(m.name||'Bạn').slice(0,20),team:cnt[0]<=cnt[1]?0:1,score:0,streak:0,a:{},steps:0,ok:0,no:0,seen:0,pet:0};p.uid=/^[0-9a-f-]{36}$/.test(m.uid||'')?m.uid:null;p.pet=((+m.pet||0)%7+7)%7;p.name=String(m.name||p.name).slice(0,20);p.seen=Date.now();render();send();return}
 if(!p)return;p.seen=Date.now();if(m.cur!==undefined)p.cur=String(m.cur).slice(0,120);
 if(m.qa&&(H.game==='race'||H.game==='tug')&&H.ph==='run'){H.log.unshift({n:p.name,pet:p.pet,t:p.team,p:String(m.qa.p).slice(0,80),a:String(m.qa.a).slice(0,60),ok:m.qa.ok?1:0});H.log.length=Math.min(H.log.length,8)}
 if(m.t==='gift'&&H.game==='quiz'&&H.gift&&H.ph==='rv'&&m.q===H.i&&H.res[m.id]&&H.res[m.id][1]&&H.gifts[m.id]===undefined){const pool=[500,300,200,200,100,100,0,-150],v=pool[Math.floor(Math.random()*pool.length)];H.gifts[m.id]=v;p.score=Math.max(0,p.score+v);render();send();return}
 if(m.t==='ans'&&H.game==='quiz'&&H.ph==='q'&&m.q===H.i&&p.a[H.i]===undefined){p.a[H.i]={c:m.c,ms:Date.now()-H.t0};render();send();if(act().every(x=>x.a[H.i]!==undefined))setTimeout(()=>{if(H.ph==='q'&&H.i===m.q)reveal()},600)}
 if(m.t==='prog'&&(H.game==='race'||H.game==='tug')&&H.ph==='run'){if(H.game==='tug'){p.steps=Math.max(0,Math.min(999,+m.steps||0));p.ok=+m.ok||0;p.no=+m.no||0;const t=teamScores('steps');if(Math.abs(t[0]-t[1])>=H.goal)endGame();else{render();send()}}else{p.steps=Math.max(0,Math.min(H.goal,+m.steps||0));p.ok=+m.ok||0;p.no=+m.no||0;if(p.steps>=H.goal)endGame();else render()}}}
function startQuiz(){const qs=[],seen=new Set();let g=0;while(qs.length<H.n&&g++<H.n*30){const q=C.makeQ(H.content);if(q&&!seen.has(q.prompt)){seen.add(q.prompt);qs.push(q)}}
 if(!qs.length){alert('Nội dung chưa đủ để ra câu hỏi (cần ít nhất 4 từ). Cô chọn thêm bài trong phòng nhé.');return}
 H.qs=qs;H.n=qs.length;Object.values(H.P).forEach(p=>{p.score=0;p.streak=0;p.a={}});H.i=0;nextQ()}
function nextQ(){H.gifts={};H.ph='q';H.t0=Date.now();H.counts=[];H.res={};render();send()}
function reveal(){if(H.ph!=='q')return;const q=H.qs[H.i];H.ph='rv';H.counts=q.opts.map(()=>0);H.res={};
 Object.values(H.P).forEach(p=>{const a=p.a[H.i];if(!a){p.streak=0;H.res[p.id]=[0,0,-1];return}H.counts[a.c]++;const ok=q.opts[a.c]===q.ans;
  if(ok){p.streak++;const pts=Math.round(1000*(.5+.5*Math.max(0,1-a.ms/(H.dur*1000))))+Math.min(p.streak-1,4)*50;p.score+=pts;H.res[p.id]=[pts,1,a.c]}else{p.streak=0;H.res[p.id]=[0,0,a.c]}});
 C.beep(true);render();send()}
function next(){if(H.i+1>=H.n)return endGame();H.i++;nextQ()}
function startRace(){H.log=[];Object.values(H.P).forEach(p=>{p.steps=0;p.ok=0;p.no=0});H.t0=Date.now();H.ph='run';render();send()}
async function endGame(){if(H.ph==='end')return;H.ph='end';render();send();
 if(!RWL.MOCK){const key='live-'+H.game;await Promise.all(Object.values(H.P).filter(p=>(H.game==='quiz'?p.score:p.steps)>0).map(p=>C.rpc('submit_score_for',{p_game:key,p_code:code,p_player:p.name,p_score:H.game==='quiz'?p.score:p.steps,p_uid:p.uid||null}).catch(()=>{})))}}
function reset(){H.ph='lobby';render();send()}
const medal=i=>['🥇','🥈','🥉'][i]||(i+1);
const rankHtml=(r,k)=>'<ul class="rank">'+r.map((p,i)=>`<li><span class="n">${medal(i)}</span><b>${E(p[1])}</b>${H.teams?`<span class="chip t${p[3]}">${p[3]?'Xanh':'Đỏ'}</span>`:''}<span>${p[2]}${k||''}</span></li>`).join('')+'</ul>';
const teamBar=ts=>H.teams&&ts?`<div class="row" style="margin:8px 0"><span class="chip t0">Đội Đỏ: <b>${ts[0]}</b></span><span class="chip t1">Đội Xanh: <b>${ts[1]}</b></span></div>`:'';
function render(){const m=$('main');if(!m||!H.room)return;if(H.ph==='lobby')saveSet();$('cnt').textContent='👥 '+act().length+' học sinh';let h='';
 if(H.ph==='lobby'){const sel=H.content;h=`<div class="card" style="text-align:center"><div class="muted">Học sinh vào <b>${new URL('live.html',location.href).host+new URL('live.html',location.href).pathname}</b> và nhập mã phòng</div><div class="code">${code}</div><div class="row" style="justify-content:center"><button class="btn sm" id="cpl">📋 Chép link cho học sinh</button><span class="muted" id="cpm"></span></div></div>
 <div class="card"><h2>Chọn trò</h2><div class="row" style="margin:10px 0"><button class="btn ${H.game==='quiz'?'pri':''}" data-g="quiz">⚡ Đấu trường (cả lớp cùng trả lời)</button><button class="btn ${H.game==='race'?'pri':''}" data-g="race">🏁 Đua cá voi (ai nhanh về đích)</button><button class="btn ${H.game==='tug'?'pri':''}" data-g="tug">🪢 Kéo co (Đỏ – Xanh)</button></div>
 <div class="row">${H.game==='quiz'?`<div style="width:150px"><label>Số câu</label><input type="number" id="sn" min="3" max="60" value="${H.n}"></div><div style="width:150px"><label>Giây mỗi câu</label><input type="number" id="sd" min="5" max="60" value="${H.dur}"></div>`:`<div style="width:150px"><label>${H.game==='tug'?'Chênh lệch điểm để thắng':'Số bước tới đích'}</label><input type="number" id="sg" min="5" max="60" value="${H.goal}"></div><div style="width:170px"><label>Thời gian tối đa (giây)</label><input type="number" id="sr" min="30" max="900" value="${H.rdur}"></div>`}
 ${H.game==='quiz'?`<label style="display:flex;gap:8px;align-items:center;margin-top:24px;color:var(--ink)"><input type="checkbox" id="sgf" style="width:auto" ${H.gift?'checked':''}> 🎁 Hộp quà may mắn</label>`:''}<label style="display:flex;gap:8px;align-items:center;margin-top:24px;color:var(--ink)"><input type="checkbox" id="stm" style="width:auto" ${H.teams||H.game==='tug'?'checked':''} ${H.game==='tug'?'disabled':''}> Chia 2 đội (Đỏ – Xanh)</label></div>
 <p class="muted">Nội dung: ${sel.vocab.length} từ vựng · ${sel.quiz.length} câu ngữ pháp (theo bài cô đã chọn cho phòng).</p></div>
 <div class="card"><h2>Học sinh đã vào (${act().length})</h2><div class="chips" style="margin:10px 0">${act().map(p=>`<span class="chip ${H.teams?'t'+p.team:''}">${RWL.petHtml(p.pet,34)} ${E(p.name)}</span>`).join('')||'<span class="muted">Chưa có ai. Gửi mã phòng cho học sinh nhé.</span>'}</div><button class="btn pri" id="go">▶ Bắt đầu</button></div>`}
 else if(H.game==='quiz'&&(H.ph==='q'||H.ph==='rv')){const q=H.qs[H.i],left=Math.max(0,H.dur-(Date.now()-H.t0)/1000),na=act().filter(p=>p.a[H.i]!==undefined).length;
  h=`<div class="card"><div class="row"><span class="pill">Câu ${H.i+1}/${H.n}</span><span class="sp" style="flex:1"></span>${H.ph==='q'?`<span class="timer">${Math.ceil(left)}</span>`:''}</div><div class="bar" style="margin:10px 0"><i style="width:${H.ph==='q'?left/H.dur*100:0}%"></i></div>
  <div style="text-align:center;margin:14px 0"><div class="${q.zh?'big':'big'}" style="${q.zh?'':'font-family:var(--f-d);font-size:clamp(28px,6vw,54px)'}">${E(q.prompt)}</div><div class="muted">${E(q.sub||'')}</div></div>
  <div class="ans host">${q.opts.map((o,k)=>`<button class="${q.type==='vn2zh'?'zh':''} ${H.ph==='rv'?(o===q.ans?'right':'dim'):''}">${E(o)}${H.ph==='rv'?`<br><small>${H.counts[k]} bạn</small>`:''}</button>`).join('')}</div>
  <div class="row" style="margin-top:14px"><span class="muted">Đã trả lời: <b>${na}/${act().length}</b></span><span style="flex:1"></span>${H.ph==='q'?'<button class="btn gold" id="rv">Hiện đáp án</button>':`<button class="btn pri" id="nx">${H.i+1>=H.n?'🏆 Xem kết quả':'Câu tiếp ▶'}</button>`}</div></div>
  ${(H.ph==='rv'||H.i>0)?`<div class="card"><h3>🏆 Bảng xếp hạng</h3>${teamBar(teamScores())}${rankHtml(board().slice(0,8).map(p=>[p.id,p.name,p.score,p.team]),'')}</div>`:''}`}
 else if(H.game==='tug'&&H.ph==='run'){const left=Math.max(0,H.rdur-(Date.now()-H.t0)/1000),t=teamScores('steps'),d=t[0]-t[1],pos=50-Math.max(-1,Math.min(1,d/H.goal))*42,side=k=>act().filter(p=>p.team===k).slice(0,12).map(p=>`<span class="tp" title="${E(p.name)}">${RWL.petHtml(p.pet,46)}<small>${E(p.name)} · ${p.steps}</small></span>`).join('');
  h=`<div class="card"><div class="row"><span class="pill">Kéo co · cách biệt ${H.goal} điểm là thắng</span><span style="flex:1"></span><span class="timer">${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}</span></div>
  <div class="row" style="justify-content:space-between;margin:12px 0"><span class="chip t0" style="font-size:20px">Đội Đỏ: <b>${t[0]}</b></span><span class="chip t1" style="font-size:20px">Đội Xanh: <b>${t[1]}</b></span></div>
  <div class="rope"><i class="zr"></i><i class="zb"></i><span class="mid"></span><span class="flag" style="left:${pos}%">🚩</span></div>
  <div class="tugs"><div class="tg r">${side(0)}</div><div class="tg b">${side(1)}</div></div>
  ${rankCard()}${qPanel()}<div class="row" style="margin-top:12px"><span class="muted">Mỗi câu đúng của một bạn là 1 điểm cho cả đội. Đội nào hơn đối thủ ${H.goal} điểm trước sẽ thắng.</span><span style="flex:1"></span><button class="btn gold" id="end">Kết thúc</button></div></div>`}
 else if(H.game==='race'&&H.ph==='run'){const left=Math.max(0,H.rdur-(Date.now()-H.t0)/1000),B=act().sort((a,b)=>b.steps-a.steps).slice(0,14).sort((a,b)=>a.id<b.id?-1:1);
  h=`<div class="card"><div class="row"><span class="pill">Đua cá voi · đích ${H.goal} bước</span><span style="flex:1"></span><span class="timer">${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}</span></div>${teamBar(teamScores('steps'))}
  <div class="track" style="margin-top:10px">${(B.length?B:[null]).map(p=>`<div class="lane">${tileHtml()}${p?`<div class="w" style="left:calc(${Math.min(100,p.steps/H.goal*100)}% * .86)">${RWL.petHtml(p.pet,70)}<small>${E(p.name)} · ${p.steps}</small></div>`:''}</div>`).join('')}<div class="finish"></div></div>
  <div class="leg"><span>⭐ Sao biển: +2 bước</span><span>🌀 Xoáy nước: đứng 2 giây</span><span>🪨 Đá ngầm: lùi 1 bước</span></div>
  ${rankCard()}${qPanel()}<div class="row" style="margin-top:12px"><span class="muted">Học sinh tự trả lời trên máy; trả lời đúng thì cá voi tiến 1 bước.</span><span style="flex:1"></span><button class="btn gold" id="end">Kết thúc</button></div></div>`}
 else if(H.ph==='end'){const R=H.game==='quiz'?board().map(p=>[p.id,p.name,p.score,p.team]):Object.values(H.P).sort((a,b)=>b.steps-a.steps||a.no-b.no).map(p=>[p.id,p.name,p.steps,p.team]);
  h=`<div class="card"><h2 style="text-align:center">🏆 Kết quả</h2>${teamBar(teamScores(H.game!=='quiz'?'steps':''))}<div class="pod">${[1,0,2].map(i=>R[i]?`<div class="p${i+1}">${medal(i)}<br>${E(R[i][1])}<br>${R[i][2]}</div>`:'').join('')}</div>${rankHtml(R.slice(0,30),H.game==='race'?' bước':H.game==='tug'?' điểm':'')}
  <p class="muted">Điểm đã được lưu vào phòng, cô xem ở trang "Phòng của cô".</p><div class="row"><button class="btn pri" id="again">Chơi lại</button><a class="btn" href="phong.html">Về phòng của cô</a></div></div>`}
 m.innerHTML=h;wire()}
function wire(){const g=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{saveSet();H.game=b.dataset.g;if(H.game==='tug'){H.teams=true;if(H.goal>15)H.goal=10}else if(H.game==='race'&&H.goal<15)H.goal=25;render()});
 g('sa',()=>{H.showAns=!H.showAns;render()});g('go',()=>{saveSet();if(H.game==='tug')H.teams=true;H.mode=H.game;H.game==='quiz'?startQuiz():startRace()});g('rv',reveal);g('nx',next);g('end',endGame);g('again',reset);
 g('cpl',async()=>{try{await navigator.clipboard.writeText(playerUrl());$('cpm').textContent='Đã chép!'}catch(e){$('cpm').textContent=playerUrl()}})}
function saveSet(){const v=id=>{const e=$(id);return e?+e.value:null};const gf=$('sgf');if(gf)H.gift=gf.checked;const t=$('stm');if(t)H.teams=t.checked;if(H.game==='tug')H.teams=true;if(v('sn'))H.n=Math.min(40,Math.max(3,v('sn')));if(v('sd'))H.dur=Math.min(60,Math.max(5,v('sd')));if(v('sg'))H.goal=Math.min(60,Math.max(5,v('sg')));if(v('sr'))H.rdur=Math.min(900,Math.max(30,v('sr')))}
(async()=>{try{if(!code)throw new Error('Thiếu mã phòng.');
 H.room=await RWL.getRoom(code);const cfg=H.room.config||{};await C.Data.need(true,Object.keys(cfg.gram||{}).length>0);
 H.content={vocab:C.Data.vocab(cfg.vocab),quiz:C.Data.gramQuiz(cfg.gram),points:[]};
 conn=await RWL.connect(code,onMsg);setInterval(()=>{if(H.ph==='q'&&Date.now()-H.t0>=H.dur*1000)reveal();if(H.ph==='run'&&Date.now()-H.t0>=H.rdur*1000)endGame();if(H.ph==='q'||H.ph==='run')render();send()},1000);render()}
 catch(e){$('main').innerHTML='<div class="card"><p class="err">'+E(e.message||e)+'</p><a class="btn" href="phong.html">Về phòng của cô</a></div>'}})();
</script></body></html>
