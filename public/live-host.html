<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lớp học trực tiếp – Giáo viên điều khiển</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&family=Noto+Serif+SC:wght@600;800&display=swap">
<link rel="stylesheet" href="rwlive.css">
<script>try{var t=localStorage.getItem('rw_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="phong-theme.css"><link rel="stylesheet" href="adventure.css"></head><body class="host-page"><div class="wrap">
<div class="top"><a class="btn sm" href="phong.html">← Phòng của giáo viên</a><span class="brand"><i class="lg"></i>Lớp học trực tiếp</span><span class="sp"></span><span class="muted" id="cnt"></span><button type="button" class="btn sm" id="present" aria-pressed="false">⛶ Chế độ máy chiếu</button></div>
<div class="solo-shortcut" style="margin:12px 0"><a class="btn sm" href="thang-va-ran.html?view=teacher" target="_blank" rel="noopener">🎲 Thang và Rắn · Mở bàn chiếu</a><span class="muted" style="margin-left:10px">Chơi cùng lớp trên màn hình chung</span></div><div id="main"><p class="muted">Đang kết nối…</p></div></div>
<script src="whales.js"></script><script src="config.js"></script><script src="audio.js"></script><script src="rwcore.js"></script><script src="rwlive.js"></script><script src="characters.js"></script><script src="adventure.js"></script>
<script>
const C=RWC,$=id=>document.getElementById(id),E=C.esc;
const code=(new URLSearchParams(location.search).get('phong')||'').toUpperCase();
const H={session:Date.now(),room:null,content:null,P:{},mode:'lobby',game:'quiz',ph:'lobby',i:0,n:20,dur:15,qs:[],t0:0,log:[],showAns:false,teams:false,gift:true,gifts:{},goal:25,rdur:240,counts:[],res:{},rank:[],tick:0,link:null};
const playerUrl=()=>new URL('live.html?phong='+code+(RWL.MOCK?'&mock=1':''),location.href).href;
const PRESETS=[{k:'submarine',n:'🤿 Đua tàu ngầm',g:'race',sk:'submarine',rule:'normal'},{k:'balloon',n:'🎈 Khinh khí cầu',g:'race',sk:'balloon',rule:'normal'},{k:'train',n:'🚂 Chuyến tàu tri thức',g:'race',sk:'train',rule:'normal'},{k:'car',n:'🏎️ Đua xe',g:'race',sk:'car',rule:'normal'},{k:'rocket',n:'🚀 Tên lửa lên Mặt Trăng',g:'race',sk:'rocket',rule:'normal'},{k:'climb',n:'⛰️ Leo núi',g:'race',sk:'climb',rule:'normal'},{k:'boat',n:'⛵ Đua thuyền',g:'race',sk:'boat',rule:'normal'},{k:'pen',n:'⚠️ Đua phạt (sai thì lùi 1 bước)',g:'race',sk:'whale',rule:'penalty'},{k:'surv',n:'🛡️ Sinh tồn (sai 3 lần bị loại)',g:'race',sk:'car',rule:'survive'},{k:'boss',n:'🦈 Đánh trùm cá mập (cả lớp hợp sức)',g:'coop',sk:'boss',rule:'normal'},{k:'tower',n:'🏰 Xây tháp (cả lớp hợp sức)',g:'coop',sk:'tower',rule:'normal'}];
const act=()=>Object.values(H.P).filter(p=>Date.now()-p.seen<12000);
const board=()=>act().concat(Object.values(H.P).filter(p=>Date.now()-p.seen>=12000&&p.score>0)).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'vi'));
function snap(){const s={t:'st',m:H.game,ph:H.ph,np:act().length,tm:{},teams:H.teams,sk:H.skin||'whale',rule:H.rule||'normal',sd:H.sd||0};RWL.skin=H.skin||'whale';act().forEach(p=>{s.tm[p.id]=p.team});
 s.session=H.session;s.ch=Object.fromEntries(Object.values(H.P).map(p=>[p.id,p.pet]));const now=Date.now();
 if(H.ph==='lobby'){return s}
 if(H.game==='quiz'){const q=H.qs[H.i];s.i=H.i;s.n=H.n;s.dur=H.dur;s.left=Math.max(0,H.dur-(now-H.t0)/1000);s.q={prompt:q.prompt,sub:q.sub,opts:q.opts,zh:!!q.zh};
  s.na=act().filter(p=>p.a[H.i]!==undefined).length;
  s.gf=H.gift;if(H.ph==='rv'){s.ans=q.ans;s.counts=H.counts;s.res=H.res;s.gifts=H.gifts}
  s.top=board().slice(0,8).map(p=>[p.id,p.name,p.score,p.team]);if(H.teams)s.ts=teamScores();
  if(H.ph==='end')s.rank=board().slice(0,60).map(p=>[p.id,p.name,p.score,p.team])}
 else{s.goal=H.goal;if(H.game==='coop'){s.hp=H.hp;s.dmg=act().reduce((a,p)=>a+p.steps,0)}if(H.rule==='survive')s.lives=Object.fromEntries(act().map(p=>[p.id,Math.max(0,3-p.no)]));s.left=Math.max(0,H.rdur-(now-H.t0)/1000);s.dur=H.rdur;s.bd=act().sort((a,b)=>b.steps-a.steps).slice(0,16).map(p=>[p.id,p.name,p.steps,p.team,p.pet]);if(H.teams)s.ts=teamScores('steps');
  if(H.ph==='end')s.rank=Object.values(H.P).sort((a,b)=>b.steps-a.steps||a.no-b.no).slice(0,60).map(p=>[p.id,p.name,p.steps,p.team])}
 return s}
const tileHtml=()=>{const T=RWL.tiles(code,H.goal);return Object.keys(T).map(p=>`<span class="tile" style="left:calc(${p/H.goal*100}% * .86)">${RWL.KIND[T[p]].ic}</span>`).join('')};
const sumBar=()=>{const A=act(),C=(n,t,bg)=>`<span class="chip" style="font-size:22px;padding:10px 18px;${bg?'background:'+bg:''}"><b>${n}</b> ${t}</span>`;let x;if(H.game==='tug'){x=C(A.filter(p=>p.team===0).length,'bạn đội Đỏ đang kéo','var(--rose)')+C(A.filter(p=>p.team===1).length,'bạn đội Xanh đang kéo','var(--sky)')}else if(H.game==='coop'){x=C(A.length,'bạn đang '+(H.skin==='boss'?'đánh trùm':'xây tháp'))+C(A.filter(p=>p.cur&&Date.now()-p.seen<20000).length,'bạn đang trả lời','var(--mint)')}else{const fin=A.filter(p=>p.steps>=H.goal).length,v=({car:'đang đua xe',rocket:'đang bay lên Mặt Trăng',climb:'đang leo núi',boat:'đang chèo thuyền',submarine:'đang lặn',balloon:'đang bay',train:'đang trên tàu'})[H.skin]||'đang bơi';x=C(A.length-fin,'bạn '+v)+C(fin,'bạn đã về đích','var(--mint)')}return`<div class="row" style="gap:12px;margin:12px 0">${x}</div>`};
const rankCard=()=>{const R=Object.values(H.P).filter(p=>p.seen).sort((a,b)=>b.steps-a.steps||a.no-b.no).slice(0,12).map(p=>[p.id,p.name,p.steps,p.team]);return`<div style="margin-top:12px"><h4 style="margin:0 0 4px;font:800 16px var(--f-d)">🏆 Bảng xếp hạng</h4>${R.length?rankHtml(R,H.game==='tug'?' điểm':' bước'):'<p class="muted">Chưa có ai.</p>'}</div>`};
const qPanel=()=>{const L=act().sort((a,b)=>a.name<b.name?-1:1);const row=p=>{const ok=p.ok||0,no=p.no||0,t=ok+no,pc=t?Math.round(ok*100/t):0,busy=p.cur&&Date.now()-(p.seen||0)<20000;return`<div class="qc"><span>${RWL.petHtml(p.pet,30)}</span><b style="flex:1">${E(p.name)}</b><span class="muted">${busy?'✍️ đang trả lời':'⏳ chờ'}</span>${H.showAns?`<span class="muted">câu ${t+1}</span>`:''}<span>✔ ${ok}</span><span>✘ ${no}</span><b style="min-width:44px;text-align:right">${t?pc+'%':'–'}</b></div>`};const prog=Math.max(0,...L.map(p=>(p.ok||0)+(p.no||0))),k=H.qv==null?prog:Math.max(0,H.qv),q=H.showAns&&H.content?RWL.seedQ(C,H.content,H.sd||0,k):null;const qv=q?`<div class="card" style="margin:10px 0;background:var(--panel2,#fff)"><div class="row"><button class="btn sm" id="qprev">‹</button><b style="flex:1;text-align:center">Câu ${k+1} · cả lớp cùng bộ câu hỏi${H.qv==null?' (bạn đi xa nhất)':''}</b><button class="btn sm" id="qnext">›</button></div><div style="text-align:center;margin:10px 0"><div class="big" style="${q.zh?'':'font-family:var(--f-d);font-size:clamp(26px,3.5vw,44px)'}">${E(q.prompt)}</div><div class="muted">${E(q.sub||'')}</div></div><div class="ans">${q.opts.map(o=>`<button disabled>${E(o)}</button>`).join('')}</div></div>`:'';return`<div class="qp" style="grid-template-columns:1fr"><div><h4>👥 Học sinh đang làm bài <button class="btn sm" id="sa" style="float:right;display:inline-flex;align-items:center;gap:6px">${window.RWH?RWH('none',30):''} ${H.showAns?'Ẩn câu hỏi':'Xem câu hỏi'}</button></h4>${qv}${L.length?L.map(row).join(''):'<p class="muted">Chưa có học sinh nào.</p>'}</div></div>`};
const teamScores=(k)=>{const t=[0,0];Object.values(H.P).forEach(p=>{t[p.team]+=(k==='steps'?p.steps:p.score)});return t};
const livePlayers=()=>act().map(p=>({...p}));
let conn=null;const send=()=>{if(conn)conn.send(snap())};
function onMsg(m){if(!m||!m.id)return;let p=H.P[m.id];
 if(m.t==='join'){const cnt=[0,0];Object.values(H.P).forEach(x=>cnt[x.team]++);if(!p)p=H.P[m.id]={id:m.id,name:String(m.name||'Bạn').slice(0,20),team:cnt[0]<=cnt[1]?0:1,score:0,streak:0,a:{},steps:0,ok:0,no:0,seen:0,pet:0};p.uid=/^[0-9a-f-]{36}$/.test(m.uid||'')?m.uid:null;p.pet=AV.norm(m.pet);p.name=String(m.name||p.name).slice(0,20);p.seen=Date.now();render();send();return}
 if(!p)return;p.seen=Date.now();if(m.cur!==undefined)p.cur=String(m.cur).slice(0,120);
 if(m.qa&&(H.game==='race'||H.game==='tug'||H.game==='coop')&&H.ph==='run'){H.log.unshift({n:p.name,pet:p.pet,t:p.team,p:String(m.qa.p).slice(0,80),a:String(m.qa.a).slice(0,60),ok:m.qa.ok?1:0});H.log.length=Math.min(H.log.length,8)}
 if(m.t==='gift'&&H.game==='quiz'&&H.gift&&H.ph==='rv'&&m.q===H.i&&H.res[m.id]&&H.res[m.id][1]&&H.gifts[m.id]===undefined){const pool=[500,300,200,200,100,100,0,-150],v=pool[Math.floor(Math.random()*pool.length)];H.gifts[m.id]=v;p.score=Math.max(0,p.score+v);render();send();return}
 if(m.t==='ans'&&H.game==='quiz'&&H.ph==='q'&&m.q===H.i&&p.a[H.i]===undefined){p.a[H.i]={c:m.c,ms:Date.now()-H.t0};render();send();if(act().every(x=>x.a[H.i]!==undefined))setTimeout(()=>{if(H.ph==='q'&&H.i===m.q)reveal()},600)}
 if(m.t==='prog'&&H.game==='coop'&&H.ph==='run'){p.steps=Math.max(0,Math.min(999,+m.steps||0));p.ok=+m.ok||0;p.no=+m.no||0;if(act().reduce((a,x)=>a+x.steps,0)>=H.hp)endGame();else{render();send()}}
 else if(m.t==='prog'&&(H.game==='race'||H.game==='tug')&&H.ph==='run'){if(H.game==='tug'){p.steps=Math.max(0,Math.min(999,+m.steps||0));p.ok=+m.ok||0;p.no=+m.no||0;const t=teamScores('steps');if(Math.abs(t[0]-t[1])>=H.goal)endGame();else{render();send()}}else{p.steps=Math.max(0,Math.min(H.goal,+m.steps||0));p.ok=+m.ok||0;p.no=+m.no||0;if(p.steps>=H.goal)endGame();else if(H.rule==='survive'&&act().length&&act().every(x=>x.no>=3))endGame();else render()}}}
function startQuiz(){const qs=[],seen=new Set();let g=0;while(qs.length<H.n&&g++<H.n*30){const q=C.makeQ(H.content);if(q&&!seen.has(q.prompt)){seen.add(q.prompt);qs.push(q)}}
 if(!qs.length){alert('Nội dung chưa đủ để ra câu hỏi (cần ít nhất 4 từ). Hãy chọn thêm bài trong phòng nhé.');return}
 H.qs=qs;H.n=qs.length;Object.values(H.P).forEach(p=>{p.score=0;p.streak=0;p.a={}});H.i=0;nextQ()}
function nextQ(){H.gifts={};H.ph='q';H.t0=Date.now();H.counts=[];H.res={};render();send()}
function reveal(){if(H.ph!=='q')return;const q=H.qs[H.i];H.ph='rv';H.counts=q.opts.map(()=>0);H.res={};
 Object.values(H.P).forEach(p=>{const a=p.a[H.i];if(!a){p.streak=0;H.res[p.id]=[0,0,-1];return}H.counts[a.c]++;const ok=q.opts[a.c]===q.ans;
  if(ok){p.streak++;const pts=Math.round(1000*(.5+.5*Math.max(0,1-a.ms/(H.dur*1000))))+Math.min(p.streak-1,4)*50;p.score+=pts;H.res[p.id]=[pts,1,a.c]}else{p.streak=0;H.res[p.id]=[0,0,a.c]}});
 C.beep(true);render();send()}
function next(){if(H.i+1>=H.n)return endGame();H.i++;nextQ()}
function startRace(){H.sd=Date.now();H.qv=null;H.log=[];Object.values(H.P).forEach(p=>{p.steps=0;p.ok=0;p.no=0});H.hp=Math.max(10,H.goal*Math.max(1,act().length));H.t0=Date.now();H.ph='run';render();send()}
async function endGame(){if(H.ph==='end')return;H.ph='end';render();send();
 if(!RWL.MOCK){const key='live-'+H.game;await Promise.all(Object.values(H.P).filter(p=>(H.game==='quiz'?p.score:p.steps)>0).map(p=>C.rpc('submit_score_for',{p_game:key,p_code:code,p_player:p.name,p_score:H.game==='quiz'?p.score:p.steps,p_uid:p.uid||null}).catch(()=>{})))}}
function reset(){H.ph='lobby';render();send()}
const medal=i=>i<3?RWL.IC(['medal-gold','medal-silver','medal-bronze'][i],48):(i+1);
const rankHtml=(r,k)=>'<ul class="rank">'+r.map((p,i)=>`<li><span class="n">${medal(i)}</span><b>${E(p[1])}</b>${H.teams?`<span class="chip t${p[3]}">${p[3]?'Xanh':'Đỏ'}</span>`:''}<span>${p[2]}${k||''}</span></li>`).join('')+'</ul>';
const teamBar=ts=>H.teams&&ts?`<div class="row" style="margin:8px 0"><span class="chip t0">Đội Đỏ: <b>${ts[0]}</b></span><span class="chip t1">Đội Xanh: <b>${ts[1]}</b></span></div>`:'';
function render(){const m=$('main');if(!m||!H.room)return;$('cnt').textContent='👥 '+act().length+' học sinh';let h='';
 if(H.ph==='lobby'){const sel=H.content;h=`<section class="host-title"><div><div class="eyebrow">KHÔNG GIAN GIÁO VIÊN</div><h1>Chơi cùng lớp, học cùng nhau</h1><p class="muted">Chọn trò chơi và chuẩn bị một buổi ôn tập thật vui cho cả lớp.</p></div><div class="live-badge">Phòng đang mở</div></section>
 <section class="host-share"><div class="share-main"><div><div class="share-label">MÃ THAM GIA CỦA LỚP</div><div class="code">${E(code)}</div><b>${E(H.room.name||'Lớp học trực tiếp')}</b></div>${RWL.petHtml(0,110)}</div><div class="share-right"><p class="muted">Học sinh mở liên kết và nhập mã phòng. Không cần tài khoản.</p><button class="btn" id="cpl">Chép link cho học sinh</button><span class="muted" id="cpm" style="display:block;font-size:11px;overflow-wrap:anywhere;margin-top:7px"></span></div></section>
 <div class="host-grid"><section class="card"><div class="card-title"><h2>Chọn hoạt động cho lớp</h2><span class="section-number">Bước 1</span></div><div class="game-modes">
 <button class="mode-btn ${H.game==='quiz'?'on':''}" data-g="quiz">${RWL.IC('bubble',43)}<b>Đấu trường</b><small>Cả lớp cùng trả lời, chinh phục từng câu hỏi.</small></button>
 <button class="mode-btn ${H.game==='race'&&!H.preset?'on':''}" data-g="race">${RWL.petHtml(0,72)}<b>Đua cá voi</b><small>Trả lời đúng để tiến nhanh về đích.</small></button>
 <button class="mode-btn ${H.game==='tug'?'on':''}" data-g="tug">${RWL.IC('rope-flag',43)}<b>Kéo co</b><small>Hai đội Đỏ – Xanh cùng nhau ghi điểm.</small></button></div>
 <div class="preset-title">Thêm trò chơi cho buổi học</div><div class="preset-grid">${PRESETS.map(x=>`<button class="${H.preset===x.k?'on':''}" data-p="${x.k}"><span class="preset-emoji">${x.n.split(' ')[0]}</span><span><strong>${E(x.n.slice(x.n.indexOf(' ')+1).replace(/ \(.*\)/,''))}</strong><small>${x.g==='coop'?'Cả lớp hợp sức':x.rule==='survive'?'Sai 3 lần bị loại':x.rule==='penalty'?'Sai sẽ lùi 1 bước':'Trả lời đúng để tiến lên'}</small></span></button>`).join('')}</div>
 <section class="settings"><h3>Cài đặt lượt chơi</h3><div class="settings-fields">${H.game==='quiz'?`<div><label for="sn">Số câu hỏi</label><input type="number" id="sn" min="3" max="40" value="${H.n}"></div><div><label for="sd">Giây cho mỗi câu</label><input type="number" id="sd" min="5" max="60" value="${H.dur}"></div>`:`<div><label for="sg">${H.game==='tug'?'Cách biệt điểm để thắng':H.game==='coop'?'Mục tiêu đóng góp mỗi bạn':'Số bước tới đích'}</label><input type="number" id="sg" min="5" max="60" value="${H.goal}"></div><div><label for="sr">Thời gian tối đa (giây)</label><input type="number" id="sr" min="30" max="900" value="${H.rdur}"></div>`}
 ${H.game==='quiz'?`<label class="setting-toggle"><input type="checkbox" id="sgf" ${H.gift?'checked':''}>Hộp quà may mắn</label>`:''}<label class="setting-toggle"><input type="checkbox" id="stm" ${H.teams||H.game==='tug'?'checked':''} ${H.game==='tug'?'disabled':''}>Chia 2 đội Đỏ – Xanh</label></div><div class="content-summary">Nội dung của phòng: <b>${sel.vocab.length} từ vựng · ${sel.quiz.length} câu ngữ pháp</b><br><a href="phong.html" style="color:var(--accent)">Về danh sách phòng để đổi bài học →</a></div></section></section>
 <aside class="card student-panel"><div class="card-title"><h2>Học sinh đã vào</h2><span class="student-total">${act().length}</span></div><div class="roster">${act().map(p=>`<div class="student-row">${RWL.petHtml(p.pet,48)}<b>${E(p.name)}</b><span class="ready">${H.teams?'Đội '+(p.team?'Xanh':'Đỏ'):'Sẵn sàng'}</span></div>`).join('')||`<div class="roster-empty">${RWL.petHtml(0,105)}<p>Chưa có học sinh nào.<br>Gửi mã phòng để các bạn tham gia nhé!</p></div>`}</div><button class="btn pri start-button" id="go">▶ Bắt đầu trò chơi</button><p class="start-note">Bạn điều khiển nhịp độ trên màn hình này.<br>Học sinh trả lời trên thiết bị của mình.</p></aside></div>`}
 else if(H.game==='quiz'&&(H.ph==='q'||H.ph==='rv')){const q=H.qs[H.i],left=Math.max(0,H.dur-(Date.now()-H.t0)/1000),na=act().filter(p=>p.a[H.i]!==undefined).length;
  h=`<div class="card"><div class="row"><span class="pill">Câu ${H.i+1}/${H.n}</span><span class="sp" style="flex:1"></span>${H.ph==='q'?`<span class="timer">${Math.ceil(left)}</span>`:''}</div><div class="bar" style="margin:10px 0"><i style="width:${H.ph==='q'?left/H.dur*100:0}%"></i></div>
  <div style="text-align:center;margin:14px 0"><div class="${q.zh?'big':'big'}" style="${q.zh?'':'font-family:var(--f-d);font-size:clamp(28px,6vw,54px)'}">${E(q.prompt)}</div><div class="muted">${E(q.sub||'')}</div></div>
  <div class="ans host">${q.opts.map((o,k)=>`<button class="${q.type==='vn2zh'?'zh':''} ${H.ph==='rv'?(o===q.ans?'right':'dim'):''}">${E(o)}${H.ph==='rv'?`<br><small>${H.counts[k]} bạn</small>`:''}</button>`).join('')}</div>
  <div class="row" style="margin-top:14px"><span class="muted">Đã trả lời: <b>${na}/${act().length}</b></span><span style="flex:1"></span>${H.ph==='q'?'<button class="btn gold" id="rv">Hiện đáp án</button>':`<button class="btn pri" id="nx">${H.i+1>=H.n?'🏆 Xem kết quả':'Câu tiếp ▶'}</button>`}</div></div>
  ${(H.ph==='rv'||H.i>0)?`<div class="card"><h3>Bảng xếp hạng</h3>${teamBar(teamScores())}${rankHtml(board().slice(0,8).map(p=>[p.id,p.name,p.score,p.team]),'')}</div>`:''}`}
 else if(H.ph==='run'&&(H.game==='race'||H.game==='tug'||H.game==='coop')){const left=Math.max(0,H.rdur-(Date.now()-H.t0)/1000),P=livePlayers(),sk=H.game==='tug'?'tug':H.skin||'whale';
 const scene=H.game==='tug'?AV.teamScene(P,H.goal):H.game==='coop'?AV.coopScene(P,H.hp,sk):AV.raceScene(P,H.goal,sk,code);
 h=`<div class="adventure-grid"><section class="adventure-main">${AV.heading(sk,left)}${teamBar(teamScores('steps'))}${scene}${H.game==='race'?AV.legend(sk,H.goal):''}</section>${AV.rank(P,H.game==='race'?H.goal:0,H.game==='tug'?'điểm':'đóng góp')}</div>${AV.footer(P,H.game==='race'?'Trả lời đúng để tiến thêm một bước':H.game==='tug'?'Đội đạt cách biệt '+H.goal+' điểm sẽ thắng':'Cùng hoàn thành mục tiêu trước khi hết giờ')}<details class="teacher-detail"><summary>Xem tiến độ và câu hỏi của học sinh</summary>${qPanel()}</details>`}
 else if(H.ph==='end'){const R=H.game==='quiz'?board().map(p=>[p.id,p.name,p.score,p.team]):Object.values(H.P).sort((a,b)=>b.steps-a.steps||a.no-b.no).map(p=>[p.id,p.name,p.steps,p.team]);
  h=`<div class="card"><h2 style="text-align:center">Kết quả</h2>${H.game==='coop'?(()=>{const dm=Object.values(H.P).reduce((x,p)=>x+p.steps,0),w=dm>=H.hp;return`<p style="text-align:center;font:800 22px var(--f-d)">${w?(H.skin==='boss'?'Cả lớp đã hạ trùm cá mập!':'Cả lớp đã xây xong tháp!'):(H.skin==='boss'?'Hết giờ, trùm cá mập còn '+(H.hp-dm)+' máu':'Hết giờ, tháp mới cao '+dm+'/'+H.hp+' tầng')}</p>`})():''}${teamBar(teamScores(H.game!=='quiz'?'steps':''))}<div class="pod">${[1,0,2].map(i=>R[i]?`<div class="p${i+1}">${medal(i)}<br>${E(R[i][1])}<br>${R[i][2]}</div>`:'').join('')}</div>${rankHtml(R.slice(0,30),H.game==='race'?' bước':H.game==='tug'?' điểm':H.game==='coop'?' đóng góp':'')}
  <p class="muted">${RWL.MOCK?'Phòng mô phỏng: kết quả không được lưu lên máy chủ.':'Điểm được gửi về phòng của giáo viên.'}</p><div class="row"><button class="btn pri" id="again">Chơi lại</button><a class="btn" href="phong.html">Về phòng của giáo viên</a></div></div>`}
 const detailOpen=!!m.querySelector('.teacher-detail[open]');m.innerHTML=h;if(detailOpen&&m.querySelector('.teacher-detail'))m.querySelector('.teacher-detail').open=true;
 if(H.game==='quiz'&&(H.ph==='q'||H.ph==='rv')){const original=m.firstElementChild;if(original){original.classList.add('quiz-question-card');const grid=document.createElement('div');grid.className='adventure-grid quiz-layout';grid.innerHTML=`<section class="adventure-main">${AV.heading('quiz',Math.max(0,H.dur-(Date.now()-H.t0)/1000))}</section>${AV.rank(board().map(p=>({...p,steps:p.score})),0,'điểm')}`;grid.firstElementChild.appendChild(original);m.replaceChildren(grid)}}
 if(H.ph==='end'){const R=Object.values(H.P).map(p=>({...p,steps:H.game==='quiz'?p.score:p.steps}));const result=document.createElement('div');result.className='review-rank';result.innerHTML=AV.rank(R,0,H.game==='quiz'?'điểm':'bước');m.appendChild(result)}
 wire();AV.mount()}

function wire(){document.querySelectorAll('.settings input').forEach(e=>e.oninput=saveSet);const g=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{saveSet();const x=PRESETS.find(y=>y.k===b.dataset.p);H.preset=x.k;H.game=x.g;H.skin=x.sk;H.rule=x.rule;H.teams=false;if(H.goal<8||H.goal>40)H.goal=x.g==='coop'?12:25;render()});
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{saveSet();H.preset=null;H.skin='whale';H.rule='normal';H.game=b.dataset.g;if(H.game==='tug'){H.teams=true;if(H.goal>15)H.goal=10}else if(H.game==='race'&&H.goal<15)H.goal=25;render()});
 g('sa',()=>{H.showAns=!H.showAns;H.qv=null;render()});g('qprev',()=>{const p=Math.max(0,...act().map(x=>(x.ok||0)+(x.no||0)));H.qv=Math.max(0,(H.qv==null?p:H.qv)-1);render()});g('qnext',()=>{const p=Math.max(0,...act().map(x=>(x.ok||0)+(x.no||0)));H.qv=(H.qv==null?p:H.qv)+1;render()});g('go',()=>{saveSet();if(H.game==='tug')H.teams=true;H.mode=H.game;H.game==='quiz'?startQuiz():startRace()});g('rv',reveal);g('nx',next);g('end',endGame);g('again',reset);
 g('cpl',async()=>{try{await navigator.clipboard.writeText(playerUrl());$('cpl').textContent='✓ Đã chép liên kết'}catch(e){$('cpl').textContent=playerUrl()}})}
function saveSet(){const v=id=>{const e=$(id);return e?+e.value:null};const gf=$('sgf');if(gf)H.gift=gf.checked;const t=$('stm');if(t)H.teams=t.checked;if(H.game==='tug')H.teams=true;if(v('sn'))H.n=Math.min(40,Math.max(3,v('sn')));if(v('sd'))H.dur=Math.min(60,Math.max(5,v('sd')));if(v('sg'))H.goal=Math.min(60,Math.max(5,v('sg')));if(v('sr'))H.rdur=Math.min(900,Math.max(30,v('sr')))}

/* Display controls only: no effect on room messages or scoring. */
document.getElementById('present').onclick=async()=>{const on=!document.body.classList.contains('presentation-mode');document.body.classList.toggle('presentation-mode',on);document.getElementById('present').textContent=on?'⛶ Thoát chế độ máy chiếu':'⛶ Chế độ máy chiếu';document.getElementById('present').setAttribute('aria-pressed',String(on));try{if(on&&!document.fullscreenElement)await document.documentElement.requestFullscreen();else if(!on&&document.fullscreenElement)await document.exitFullscreen()}catch(e){}};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.body.classList.remove('presentation-mode');document.getElementById('present').textContent='⛶ Chế độ máy chiếu';document.getElementById('present').setAttribute('aria-pressed','false')}});
(async()=>{try{if(!code)throw new Error('Thiếu mã phòng.');
 H.room=await RWL.getRoom(code);const cfg=H.room.config||{};await C.Data.need(true,Object.keys(cfg.gram||{}).length>0);
 H.content={vocab:C.Data.vocab(cfg.vocab),quiz:C.Data.gramQuiz(cfg.gram),points:[]};
 conn=await RWL.connect(code,onMsg);setInterval(()=>{if(H.ph==='q'&&Date.now()-H.t0>=H.dur*1000)reveal();if(H.ph==='run'&&Date.now()-H.t0>=H.rdur*1000)endGame();if(H.ph==='q'||H.ph==='run')render();send()},1000);render()}
 catch(e){$('main').innerHTML='<div class="card"><p class="err">'+E(e.message||e)+'</p><a class="btn" href="phong.html">Về phòng của giáo viên</a></div>'}})();
</script><script src="visits.js" defer></script><script src="copyright.js"></script></body></html>
