<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vào lớp học trực tiếp – Rừng Cá Voi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&family=Noto+Serif+SC:wght@600;800&display=swap">
<link rel="stylesheet" href="rwlive.css">
<script>try{var t=localStorage.getItem('rw_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head><body><div class="wrap narrow">
<div class="top"><a class="btn sm" href="index.html">← Trang chủ</a><span class="brand"><i class="lg"></i>Lớp học trực tiếp</span></div>
<div id="main"></div></div>
<script src="config.js"></script><script src="audio.js"></script><script src="rwcore.js"></script><script src="rwlive.js"></script>
<script>
const C=RWC,$=id=>document.getElementById(id),E=C.esc,ID=RWL.rid();
let code=(new URLSearchParams(location.search).get('phong')||'').toUpperCase(),name='',room=null,conn=null,S=null,got=0,mine=null,locked=false,ok=0,no=0,steps=0,evt='',evtT=0,evtBad=false,rq=null,content=null,rlock=0,done=false;
const saved=C.J(C.ls.get('rw_live_name')||'null');if(saved)name=saved;else if(C.Auth.profile&&C.Auth.profile.name)name=C.Auth.profile.name;
function joinForm(err){$('main').innerHTML=`<div class="card"><h2>Vào phòng học</h2><label>Mã phòng cô cho</label><input id="jc" value="${E(code)}" maxlength="8" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em;font-size:24px"><label>Tên của bạn</label><input id="jn" value="${E(name)}" maxlength="20" autocomplete="nickname"><p class="err">${E(err||'')}</p><button class="btn pri" id="jg">Vào chơi</button><p class="muted">Không cần đăng nhập.</p></div>`;
 $('jg').onclick=async()=>{code=$('jc').value.trim().toUpperCase();name=$('jn').value.trim();if(!code||!name)return joinForm('Hãy nhập đủ mã phòng và tên.');C.ls.set('rw_live_name',JSON.stringify(name));start()}}
async function start(){$('main').innerHTML='<p class="muted">Đang vào phòng…</p>';try{room=await RWL.getRoom(code);if(room.closed)throw new Error('Phòng này đã đóng.');
 const cfg=room.config||{};await C.Data.need(true,Object.keys(cfg.gram||{}).length>0);content={vocab:C.Data.vocab(cfg.vocab),quiz:C.Data.gramQuiz(cfg.gram)};
 C.ls.set('rw_room',JSON.stringify(room));C.ls.set('rw_me',JSON.stringify({name,code:room.code,cls:room.name}));
 conn=await RWL.connect(code,onMsg);join();setInterval(()=>conn.send({t:'ping',id:ID,cur:curQ()}),3000);setInterval(()=>{if(S&&Date.now()-got>5000)render()},1000);render()}catch(e){joinForm(e.message||String(e))}}
const join=()=>conn.send({t:'join',id:ID,name,pet:RWL.myPet(),uid:(C.Auth.loggedIn&&C.Auth.user&&C.Auth.user.id)||null});
function onMsg(m){if(!m||m.t!=='st')return;RWL.skin=m.sk||'whale';const first=!S;const prev=S;S=m;got=Date.now();
 if(!prev||prev.i!==m.i||prev.m!==m.m||(prev.ph==='lobby'&&m.ph!=='lobby')){mine=null;locked=false}
 if((m.m==='race'||m.m==='tug')&&m.ph==='run'&&(!prev||prev.ph!=='run')){ok=0;no=0;steps=0;done=false;nextRace()}
 if(first)join();render()}
const myTeam=()=>S&&S.tm&&S.tm[ID];
function render(){const M=$('main');if(!room)return;if(!S){M.innerHTML=`<div class="card" style="text-align:center"><div class="whale" style="font-size:64px">🐋</div><h2>Đang chờ cô...</h2><p class="muted">Phòng <b>${E(code)}</b>. Nếu chờ lâu, cô chưa mở lớp học trực tiếp.</p></div>`;return}
 const left=Math.max(0,(S.left||0)-(Date.now()-got)/1000);let h='';
 const tm=S.teams&&myTeam()!==undefined?`<span class="chip t${myTeam()}">Đội ${myTeam()?'Xanh':'Đỏ'}</span>`:'';
 if(S.ph==='lobby'){h=`<div class="card" style="text-align:center"><h2>Chào ${E(name)}!</h2><p>${tm} Chọn cá voi của bạn, rồi chờ cô bấm bắt đầu...</p><div class="petpick">${RWL.PETN.map((n,i)=>`<button data-pet="${i}" class="${i===RWL.myPet()?'on':''}">${RWL.petHtml(i,78)}${n}</button>`).join('')}</div><p class="muted">${S.np} bạn đang trong phòng</p><a class="btn sm" href="tro-choi.html">🎮 Chơi ôn tập trong lúc chờ</a></div>`}
 else if(S.m==='quiz'&&(S.ph==='q'||S.ph==='rv')){const q=S.q,r=S.res&&S.res[ID];
  h=`<div class="card"><div class="row"><span class="pill">Câu ${S.i+1}/${S.n}</span>${tm}<span style="flex:1"></span>${S.ph==='q'?`<span class="timer" style="font-size:34px">${Math.ceil(left)}</span>`:''}</div><div class="bar" style="margin:8px 0"><i style="width:${S.ph==='q'?left/S.dur*100:0}%"></i></div>
  <div style="text-align:center;margin:10px 0"><div class="big" style="font-size:clamp(34px,11vw,64px);${q.zh?'':'font-family:var(--f-d);font-size:clamp(24px,7vw,40px)'}">${E(q.prompt)}</div><div class="muted">${E(q.sub||'')}</div></div>
  <div class="ans">${q.opts.map((o,k)=>`<button data-k="${k}" class="${q.zh===false&&/[一-鿿]/.test(o)?'zh':''} ${S.ph==='rv'?(o===S.ans?'right':'dim'):(mine!==null&&mine!==k?'dim':'')}" ${S.ph==='rv'||mine!==null?'disabled':''}>${E(o)}</button>`).join('')}</div>
  ${S.ph==='rv'&&S.gf&&r&&r[1]?giftHtml():''}
  <div style="text-align:center;margin-top:12px">${S.ph==='q'?(mine!==null?'<p class="ok">Đã gửi! Chờ các bạn khác...</p>':'<p class="muted">Chọn nhanh để được nhiều điểm hơn</p>'):(r&&r[2]>=0?(r[1]?`<h2 class="ok">✔ Đúng rồi! +${r[0]}</h2>`:`<h2 class="err">✘ Chưa đúng</h2>`):'<h2 class="err">Bạn chưa trả lời</h2>')}</div></div>
  ${S.ph==='rv'?`<div class="card"><h3>Bảng xếp hạng</h3>${S.ts?`<div class="row" style="margin:6px 0"><span class="chip t0">Đỏ: <b>${S.ts[0]}</b></span><span class="chip t1">Xanh: <b>${S.ts[1]}</b></span></div>`:''}<ul class="rank">${S.top.map((p,i)=>`<li class="${p[0]===ID?'me':''}"><span class="n">${RWL.MEDAL(i)}</span><b>${E(p[1])}</b><span>${p[2]}</span></li>`).join('')}</ul></div>`:''}`}
 else if((S.m==='race'||S.m==='tug')&&S.ph==='run'){h=raceHtml(left)}
 else if(S.ph==='end'){const R=S.rank||[],i=R.findIndex(p=>p[0]===ID),unit=S.m==='race'?' bước':S.m==='tug'?' điểm':'';
  h=`<div class="card" style="text-align:center"><h2>Kết thúc!</h2>${i>=0?`<div class="big" style="font-family:var(--f-d)">${i<3?RWL.MEDAL(i).replace('26','64').replace('26','64'):'#'+(i+1)}</div><p>Bạn được <b>${R[i][2]}${unit}</b></p>`:'<p class="muted">Bạn chưa có điểm lần này. Lần sau cố lên nhé!</p>'}${S.ts?`<div class="row" style="justify-content:center"><span class="chip t0">Đỏ: <b>${S.ts[0]}</b></span><span class="chip t1">Xanh: <b>${S.ts[1]}</b></span></div>`:''}</div>
  <div class="card"><ul class="rank">${R.slice(0,10).map((p,k)=>`<li class="${p[0]===ID?'me':''}"><span class="n">${RWL.MEDAL(k)}</span><b>${E(p[1])}</b><span>${p[2]}${unit}</span></li>`).join('')}</ul></div>`}
 M.innerHTML=h;document.querySelectorAll('.ans button[data-k]').forEach(b=>b.onclick=()=>answer(+b.dataset.k))}
function giftHtml(){const g=S.gifts&&S.gifts[ID];if(g!==undefined)return`<div class="card" style="text-align:center;background:var(--gold);color:#1b1405"><div style="font-size:44px">${g>0?RWL.IC('pearl',54):g===0?RWL.IC('gift-box',54):RWL.IC('shark',64)}</div><h3>${g>0?'Hộp quà: +'+g+' điểm!':g===0?'Hộp quà rỗng, tiếc quá!':'Cá mập cắn mất '+(-g)+' điểm!'}</h3></div>`;
 return`<div class="card" style="text-align:center"><h3>Trả lời đúng! Chọn 1 hộp quà may mắn</h3><div class="row" style="justify-content:center;margin-top:8px">${[0,1,2].map(i=>`<button class="btn gold gbox" data-gift="${i}" style="padding:8px 14px">${RWL.IC('gift-box',54)}</button>`).join('')}</div></div>`}
function answer(k){if(!S||S.m!=='quiz'||S.ph!=='q'||mine!==null)return;mine=k;conn.send({t:'ans',id:ID,q:S.i,c:k});const q=S.q;if(window.rwSay&&q.zh)rwSay(q.prompt);render()}
/* ---- Đua cá voi: mỗi bạn tự trả lời ---- */
const curQ=()=>rq?rq.prompt+(rq.sub?' · '+rq.sub:''):'';
function nextRace(){rq=C.makeQ(content);rlock=0}
function ropeHtml(){const t=S.ts||[0,0],d=t[0]-t[1],pos=50-Math.max(-1,Math.min(1,d/S.goal))*42,mt=myTeam();return`<div class="row" style="justify-content:space-between;margin:6px 0"><span class="chip t0">Đỏ <b>${t[0]}</b></span><span class="chip t1">Xanh <b>${t[1]}</b></span></div><div class="rope"><i class="zr"></i><i class="zb"></i><span class="mid"></span><span class="flag" style="left:${pos}%">${RWL.IC("rope-flag",34)}</span></div><p class="muted" style="text-align:center;margin:4px 0">Bạn thuộc <b>đội ${mt?'Xanh':'Đỏ'}</b>. Trả lời đúng để kéo cờ về phía đội mình!</p>`}
function raceHtml(left){if(!rq)nextRace();const lk=Date.now()<rlock;
 const lead=(S.bd||[]).slice(0,5);
 return`<div class="card"><div class="row"><span class="pill">${S.m==='tug'?'Kéo co · bạn ghi '+steps+' điểm':'Bước '+steps+'/'+S.goal}</span>${S.teams&&myTeam()!==undefined?`<span class="chip t${myTeam()}">Đội ${myTeam()?'Xanh':'Đỏ'}</span>`:''}<span style="flex:1"></span><span class="timer" style="font-size:30px">${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}</span></div>
 ${S.m==='tug'?ropeHtml():`<div class="track" style="margin:8px 0"><div class="lane">${Object.entries(RWL.tiles(code,S.goal)).map(([p,k])=>`<span class="tile" style="left:calc(${p/S.goal*100}% * .84)">${RWL.KIND[k].ic}</span>`).join('')}<div class="w" style="left:calc(${Math.min(100,steps/S.goal*100)}% * .84)">${RWL.petHtml(RWL.myPet(),64)}</div></div><div class="finish"></div></div>`}
 <div class="evt ${evtBad?'bad':''}">${Date.now()<evtT?E(evt):''}</div>
 <div style="text-align:center;margin:8px 0"><div class="big" style="font-size:clamp(34px,11vw,64px);${rq.zh?'':'font-family:var(--f-d);font-size:clamp(24px,7vw,40px)'}">${E(rq.prompt)}</div><div class="muted">${E(rq.sub||'')}</div></div>
 <div class="ans">${rq.opts.map((o,k)=>`<button data-r="${k}" ${lk?'disabled class="dim"':''}>${E(o)}</button>`).join('')}</div>
 <p class="muted" style="text-align:center">${lk?(Date.now()<evtT&&evtBad&&/Xoáy/.test(evt)?'Bị xoáy nước cuốn! Chờ chút…':'Chờ chút…'):'Đúng thì cá voi bơi thêm 1 bước'}</p></div>
 <div class="card"><h3>Đang dẫn đầu</h3><ul class="rank">${lead.map((p,i)=>`<li class="${p[0]===ID?'me':''}"><span class="n">${i+1}</span><b>${E(p[1])}</b><span>${p[2]}</span></li>`).join('')}</ul></div>`}
document.addEventListener('click',e=>{const gb=e.target.closest&&e.target.closest('button[data-gift]');if(gb&&S&&S.m==='quiz'&&S.ph==='rv'){conn.send({t:'gift',id:ID,q:S.i});gb.disabled=true;return}
 const pb=e.target.closest&&e.target.closest('button[data-pet]');if(pb){RWL.setPet(+pb.dataset.pet);join();render();return}
 const b=e.target.closest&&e.target.closest('button[data-r]');if(!b||!S||(S.m!=='race'&&S.m!=='tug')||S.ph!=='run'||Date.now()<rlock)return;const k=+b.dataset.r;
 if(rq.opts[k]===rq.ans){steps++;ok++;C.beep(true);if(window.rwSay&&rq.say)rwSay(rq.say);const kd=S.m==='tug'?null:RWL.tiles(code,S.goal)[steps];evt='';if(kd){const K=RWL.KIND[kd];evt=K.t;evtBad=kd!=='star';evtT=Date.now()+2500;if(K.d)steps=Math.max(0,Math.min(S.goal,steps+K.d));if(K.lock){rlock=Date.now()+K.lock;setTimeout(()=>{rq=null;render()},K.lock)}C.beep(kd==='star')}}else{no++;C.beep(false);rlock=Date.now()+1000;setTimeout(()=>{rq=null;render()},1000)}
 const qa={p:rq.prompt,a:rq.ans,ok:rq.opts[k]===rq.ans?1:0};if(rq&&rq.opts[k]===rq.ans&&Date.now()>=rlock)rq=C.makeQ(content);conn.send({t:'prog',id:ID,steps,ok,no,qa,cur:curQ()});render()});
setInterval(()=>{if(S&&S.ph!=='lobby'&&(S.ph==='q'||S.ph==='run'))render()},1000);
if(code&&name)start();else joinForm();
</script></body></html>
