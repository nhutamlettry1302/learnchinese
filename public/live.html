<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vào lớp học trực tiếp – Rừng Cá Voi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&family=Noto+Serif+SC:wght@600;800&display=swap">
<link rel="stylesheet" href="rwlive.css">
<script>try{var t=localStorage.getItem('rw_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="phong-theme.css"><link rel="stylesheet" href="adventure.css"></head><body class="student-page"><div class="wrap narrow">
<div class="top"><a class="btn sm" href="index.html">← Trang chủ</a><span class="brand"><i class="lg"></i>Lớp học trực tiếp</span></div>
<div id="main"></div></div>
<script src="whales.js"></script><script src="config.js"></script><script src="audio.js"></script><script src="rwcore.js"></script><script src="rwlive.js"></script><script src="characters.js"></script><script src="adventure.js"></script>
<script>
const C=RWC,$=id=>document.getElementById(id),E=C.esc,ID=RWL.rid();
let code=(new URLSearchParams(location.search).get('phong')||'').toUpperCase(),name='',room=null,conn=null,S=null,got=0,mine=null,locked=false,ok=0,no=0,steps=0,evt='',evtT=0,evtBad=false,rq=null,content=null,rlock=0,done=false,hit={};
const saved=C.J(C.ls.get('rw_live_name')||'null');if(saved)name=saved;else if(C.Auth.profile&&C.Auth.profile.name)name=C.Auth.profile.name;
const SOLO_CATALOG="<section class=\"student-catalog\"><h2>Góc ôn tập của bạn</h2><p class=\"catalog-sub\">16 trò chơi để luyện từ vựng, nghe và phản xạ. Mở tab mới để vẫn giữ kết nối với lớp.</p><div class=\"solo-grid\"><a class=\"solo-link\" href=\"tro-choi.html?game=pairs\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/shell-card.svg\" alt=\"\"><span>Nối cặp</span><small>Ghép chữ với nghĩa</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=flip\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/card-back.svg\" alt=\"\"><span>Lật thẻ trí nhớ</span><small>Ghi nhớ từ vựng</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=mil\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/pearl.svg\" alt=\"\"><span>Ai là triệu phú</span><small>15 câu thử thách</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=bub\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/bubble.svg\" alt=\"\"><span>Bong bóng chữ</span><small>Phản xạ 60 giây</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=fall\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/star-fish.svg\" alt=\"\"><span>Mưa chữ</span><small>Nhanh tay chọn nghĩa</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=onet\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/treasure.svg\" alt=\"\"><span>Nối đường</span><small>Tìm cặp thông minh</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=gold\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/anchor-hook.svg\" alt=\"\"><span>Đào vàng</span><small>Móc đúng đáp án</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=flap\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/coral-gate.svg\" alt=\"\"><span>Cá voi bay</span><small>Bay qua cổng đúng</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=car\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/dice.svg\" alt=\"\"><span>Đua xe</span><small>Chọn làn đáp án</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=type\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/bubble.svg\" alt=\"\"><span>Gõ pinyin</span><small>Luyện gõ thật nhanh</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=tf\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/star-fish.svg\" alt=\"\"><span>Đúng hay sai</span><small>Kiểm tra nghĩa từ</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=whack\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/rock.svg\" alt=\"\"><span>Đập chuột chũi</span><small>Chạm đúng nghĩa</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=listen\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/bubble.svg\" alt=\"\"><span>Nghe và chọn</span><small>Luyện nghe phát âm</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=hang\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/pearl.svg\" alt=\"\"><span>Đoán pinyin</span><small>Tìm chữ còn thiếu</small></a><a class=\"solo-link\" href=\"tro-choi.html?game=seq\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/treasure.svg\" alt=\"\"><span>Trí nhớ chuỗi</span><small>Nhớ thứ tự chữ Hán</small></a><a class=\"solo-link\" href=\"thang-va-ran.html\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/game/dice.svg\" alt=\"\"><span>Thang và rắn</span><small>Đua tới ô cuối</small></a></div></section>";
function joinForm(err){$('main').innerHTML=`<section class="student-welcome">${RWL.petHtml(0,100)}<div><div class="eyebrow">SÂN CHƠI CÁ VOI ROXIE</div><h1>Vào lớp, chơi cùng bạn bè</h1><p class="muted">Chơi trực tiếp với giáo viên hoặc tự ôn tập bằng trò chơi.</p></div></section><div class="student-home-grid"><div class="card join-panel"><h2>Vào phòng học</h2><label>Mã phòng do giáo viên cấp</label><input id="jc" value="${E(code)}" maxlength="8" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em;font-size:24px"><label>Tên của bạn</label><input id="jn" value="${E(name)}" maxlength="20" autocomplete="nickname"><p class="err">${E(err||'')}</p><button class="btn pri" id="jg">Vào chơi</button><p class="muted" style="font-size:12px">Chỉ cần mã phòng và tên của bạn. Không cần đăng nhập.</p></div>${SOLO_CATALOG}</div>`;
 $('jg').onclick=async()=>{code=$('jc').value.trim().toUpperCase();name=$('jn').value.trim();if(!code||!name)return joinForm('Hãy nhập đủ mã phòng và tên.');C.ls.set('rw_live_name',JSON.stringify(name));start()}}
async function start(){$('main').innerHTML='<p class="muted">Đang vào phòng…</p>';try{room=await RWL.getRoom(code);if(room.closed)throw new Error('Phòng này đã đóng.');
 const cfg=room.config||{};await C.Data.need(true,Object.keys(cfg.gram||{}).length>0);content={vocab:C.Data.vocab(cfg.vocab),quiz:C.Data.gramQuiz(cfg.gram)};
 C.ls.set('rw_room',JSON.stringify(room));C.ls.set('rw_me',JSON.stringify({name,code:room.code,cls:room.name}));
 conn=await RWL.connect(code,onMsg);join();setInterval(()=>conn.send({t:'ping',id:ID,cur:curQ()}),3000);setInterval(()=>{if(S&&Date.now()-got>5000)render()},1000);render()}catch(e){joinForm(e.message||String(e))}}
const join=()=>conn.send({t:'join',id:ID,name,pet:RWL.myPet(),uid:(C.Auth.loggedIn&&C.Auth.user&&C.Auth.user.id)||null});
function onMsg(m){if(!m||m.t!=='st')return;RWL.skin=m.sk||'whale';window.RULE=m.rule||'normal';const prev=S&&S.session===m.session?S:null;const first=!prev;S=m;got=Date.now();
 if(!prev||prev.i!==m.i||prev.m!==m.m||(prev.ph==='lobby'&&m.ph!=='lobby')){mine=null;locked=false}
 if((m.m==='race'||m.m==='tug'||m.m==='coop')&&m.ph==='run'&&(!prev||prev.ph!=='run')){ok=0;no=0;steps=0;done=false;hit={};nextRace()}
 if(first)join();render()}
const myTeam=()=>S&&S.tm&&S.tm[ID];
function render(){const M=$('main');if(!room)return;if(!S){M.innerHTML=`<div class="card" style="text-align:center"><div class="whale" style="font-size:64px">🐋</div><h2>Đang chờ giáo viên...</h2><p class="muted">Phòng <b>${E(code)}</b>. Nếu chờ lâu, giáo viên chưa mở lớp học trực tiếp.</p></div>`;return}
 const left=Math.max(0,(S.left||0)-(Date.now()-got)/1000);let h='';
 const tm=S.teams&&myTeam()!==undefined?`<span class="chip t${myTeam()}">Đội ${myTeam()?'Xanh':'Đỏ'}</span>`:'';
 if(S.ph==='lobby'){h=`<section class="student-welcome">${RWL.petHtml(RWL.myPet(),100)}<div><div class="eyebrow">PHÒNG ${E(code)}</div><h1>Chào ${E(name)}!</h1><p class="muted">Bạn đã vào lớp. Chọn nhân vật yêu thích và sẵn sàng nhé.</p></div></section><div class="student-lobby-grid"><section class="card room-welcome"><div class="card-title"><h2>Góc của bạn</h2>${tm}</div><div class="lobby-info"><b>${E(room.name||'Lớp học trực tiếp')}</b><span>${S.np} bạn đã vào</span></div><h3 style="font-size:17px">Bạn đồng hành</h3><div class="character-choice">${AV.character(RWL.myPet(),85)}<div><b>${E(AV.list[RWL.myPet()].name)}</b><p>${E(AV.list[RWL.myPet()].group)}</p></div><button class="btn pri" id="choose-character">Đổi nhân vật</button></div><div class="waiting-note">Đang chờ giáo viên bắt đầu trò chơi…</div><h3 style="font-size:18px;margin-top:24px">Chơi chung với cả lớp</h3><p class="catalog-sub">Giáo viên chọn trò và điều khiển lượt chơi.</p><div class="live-menu">${['Đấu trường','Đua cá voi','Đua xe','Tên lửa','Leo núi','Đua thuyền','Kéo co','Đánh trùm','Xây tháp','Đua tàu ngầm','Khinh khí cầu','Chuyến tàu tri thức'].map(t=>`<span>${t}</span>`).join('')}</div></section>${SOLO_CATALOG}</div>`}
 else if(S.m==='quiz'&&(S.ph==='q'||S.ph==='rv')){const q=S.q,r=S.res&&S.res[ID];
  h=`<div class="card"><div class="row"><span class="pill">Câu ${S.i+1}/${S.n}</span>${tm}<span style="flex:1"></span>${S.ph==='q'?`<span class="timer" style="font-size:34px">${Math.ceil(left)}</span>`:''}</div><div class="bar" style="margin:8px 0"><i style="width:${S.ph==='q'?left/S.dur*100:0}%"></i></div>
  <div style="text-align:center;margin:10px 0"><div class="big" style="font-size:clamp(34px,11vw,64px);${q.zh?'':'font-family:var(--f-d);font-size:clamp(24px,7vw,40px)'}">${E(q.prompt)}</div><div class="muted">${E(q.sub||'')}</div></div>
  <div class="ans">${q.opts.map((o,k)=>`<button data-k="${k}" class="${q.zh===false&&/[一-鿿]/.test(o)?'zh':''} ${S.ph==='rv'?(o===S.ans?'right':'dim'):(mine!==null&&mine!==k?'dim':'')}" ${S.ph==='rv'||mine!==null?'disabled':''}>${E(o)}</button>`).join('')}</div>
  ${S.ph==='rv'&&S.gf&&r&&r[1]?giftHtml():''}
  <div style="text-align:center;margin-top:12px">${S.ph==='q'?(mine!==null?'<p class="ok">Đã gửi! Chờ các bạn khác...</p>':'<p class="muted">Chọn nhanh để được nhiều điểm hơn</p>'):(r&&r[2]>=0?(r[1]?`<h2 class="ok">✔ Đúng rồi! +${r[0]}</h2>`:`<h2 class="err">✘ Chưa đúng</h2>`):'<h2 class="err">Bạn chưa trả lời</h2>')}</div></div>
  ${S.ph==='rv'?`<div class="card"><h3>Bảng xếp hạng</h3>${S.ts?`<div class="row" style="margin:6px 0"><span class="chip t0">Đỏ: <b>${S.ts[0]}</b></span><span class="chip t1">Xanh: <b>${S.ts[1]}</b></span></div>`:''}<ul class="rank">${S.top.map((p,i)=>`<li class="${p[0]===ID?'me':''}"><span class="n">${RWL.MEDAL(i)}</span>${AV.character((S.ch||{})[p[0]]||0,44)}<b>${E(p[1])}</b><span>${p[2]}</span></li>`).join('')}</ul></div>`:''}`}
 else if((S.m==='race'||S.m==='tug'||S.m==='coop')&&S.ph==='run'){h=raceHtml(left)}
 else if(S.ph==='end'){const R=S.rank||[],i=R.findIndex(p=>p[0]===ID),unit=S.m==='race'?' bước':S.m==='tug'?' điểm':S.m==='coop'?' đóng góp':'';
  h=`<div class="card" style="text-align:center"><h2>Kết thúc!</h2>${i>=0?`<div class="big" style="font-family:var(--f-d)">${i<3?RWL.MEDAL(i).replace('26','64').replace('26','64'):'#'+(i+1)}</div><p>Bạn được <b>${R[i][2]}${unit}</b></p>`:'<p class="muted">Bạn chưa có điểm lần này. Lần sau cố lên nhé!</p>'}${S.ts?`<div class="row" style="justify-content:center"><span class="chip t0">Đỏ: <b>${S.ts[0]}</b></span><span class="chip t1">Xanh: <b>${S.ts[1]}</b></span></div>`:''}</div>
  <div class="card"><ul class="rank">${R.slice(0,10).map((p,k)=>`<li class="${p[0]===ID?'me':''}"><span class="n">${RWL.MEDAL(k)}</span>${AV.character((S.ch||{})[p[0]]||0,44)}<b>${E(p[1])}</b><span>${p[2]}${unit}</span></li>`).join('')}</ul></div>`}
 M.innerHTML=h;const chooser=$('choose-character');if(chooser)chooser.onclick=()=>AV.picker(RWL.myPet(),i=>{RWL.setPet(i);join();render()});AV.mount();document.querySelectorAll('.ans button[data-k]').forEach(b=>b.onclick=()=>answer(+b.dataset.k))}
function giftHtml(){const g=S.gifts&&S.gifts[ID];if(g!==undefined)return`<div class="card" style="text-align:center;background:var(--gold);color:#1b1405"><div style="font-size:44px">${g>0?RWL.IC('pearl',54):g===0?RWL.IC('gift-box',54):RWL.IC('shark',64)}</div><h3>${g>0?'Hộp quà: +'+g+' điểm!':g===0?'Hộp quà rỗng, tiếc quá!':'Cá mập cắn mất '+(-g)+' điểm!'}</h3></div>`;
 return`<div class="card" style="text-align:center"><h3>Trả lời đúng! Chọn 1 hộp quà may mắn</h3><div class="row" style="justify-content:center;margin-top:8px">${[0,1,2].map(i=>`<button class="btn gold gbox" data-gift="${i}" style="padding:8px 14px">${RWL.IC('gift-box',54)}</button>`).join('')}</div></div>`}
function answer(k){if(!S||S.m!=='quiz'||S.ph!=='q'||mine!==null)return;mine=k;conn.send({t:'ans',id:ID,q:S.i,c:k});const q=S.q;if(window.rwSay&&q.zh)rwSay(q.prompt);render()}
/* ---- Đua cá voi: mỗi bạn tự trả lời ---- */
const curQ=()=>rq?rq.prompt+(rq.sub?' · '+rq.sub:''):'';
const seedQ=()=>RWL.seedQ(C,content,(S&&S.sd)||0,ok+no);
function nextRace(){rq=seedQ();rlock=0}
function ropeHtml(){const t=S.ts||[0,0],d=t[0]-t[1],pos=50-Math.max(-1,Math.min(1,d/S.goal))*42,mt=myTeam();return`<div class="row" style="justify-content:space-between;margin:6px 0"><span class="chip t0">Đỏ <b>${t[0]}</b></span><span class="chip t1">Xanh <b>${t[1]}</b></span></div><div class="rope"><i class="zr"></i><i class="zb"></i><span class="mid"></span><span class="flag" style="left:${pos}%">${RWL.IC("rope-flag",34)}</span></div><p class="muted" style="text-align:center;margin:4px 0">Bạn thuộc <b>đội ${mt?'Xanh':'Đỏ'}</b>. Trả lời đúng để kéo cờ về phía đội mình!</p>`}
const SKN={car:'Đua xe',rocket:'Tên lửa',climb:'Leo núi',boat:'Đua thuyền',submarine:'Tàu ngầm',balloon:'Khinh khí cầu',train:'Chuyến tàu tri thức'};
function coopHtml(){const boss=S.sk==='boss',hp=S.hp||1,dm=S.dmg||0,pc=Math.min(100,dm/hp*100);return boss?`<div class="cbox" style="margin:8px 0"><div style="animation:bob 2s ease-in-out infinite">${RWL.IC('shark',90)}</div><b>Trùm cá mập · còn ${Math.max(0,hp-dm)}/${hp} máu</b><div class="hpbar"><i style="width:${100-pc}%"></i></div></div>`:`<div class="cbox" style="margin:8px 0"><div class="tower">${Array.from({length:Math.min(24,Math.ceil(dm/Math.max(1,hp/24)))},(_,i)=>`<i style="background:${['#f8e1d6','#dcece0','#deedf0','#f9e7af','#e9e3f3'][i%5]};width:70px"></i>`).join('')}</div><b>Tháp cao ${dm}/${hp} tầng</b><div class="hpbar"><i style="width:${pc}%;background:linear-gradient(90deg,#6cc070,#a8dc9a)"></i></div></div>`}
function raceHtml(left){if(!rq)nextRace();const lk=Date.now()<rlock,out=window.RULE==='survive'&&no>=3;if(out)return`<div class="card" style="text-align:center"><h2>Bạn đã bị loại!</h2><p>Bạn đạt ${steps} bước. Hãy xem các bạn còn lại cố gắng nhé.</p></div><div class="card"><h3>Đang dẫn đầu</h3><ul class="rank">${(S.bd||[]).slice(0,5).map((p,i)=>`<li class="${p[0]===ID?'me':''}"><span class="n">${i+1}</span><b>${E(p[1])}</b><span>${p[2]}</span></li>`).join('')}</ul></div>`;
 const lead=(S.bd||[]).slice(0,5);
 return`<div class="card student-question"><div class="row"><span class="pill">${S.m==='tug'?'Kéo co · bạn ghi '+steps+' điểm':S.m==='coop'?'Bạn góp '+steps+' câu đúng':(SKN[S.sk]||'Đua')+' · bước '+steps+'/'+S.goal}</span>${window.RULE==='survive'?`<span class="pill">${'♥'.repeat(Math.max(0,3-no))||'0'} mạng</span>`:''}${S.teams&&myTeam()!==undefined?`<span class="chip t${myTeam()}">Đội ${myTeam()?'Xanh':'Đỏ'}</span>`:''}<span style="flex:1"></span><span class="timer" style="font-size:30px">${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}</span></div>
 ${S.m==='tug'?AV.teamScene((S.bd||[]).map(p=>({id:p[0],name:p[1],steps:p[2],team:p[3],pet:p[4]})),S.goal):S.m==='coop'?AV.coopScene((S.bd||[]).map(p=>({id:p[0],name:p[1],steps:p[2],team:p[3],pet:p[4]})),S.hp,S.sk):AV.raceScene([{id:ID,name,steps,pet:RWL.myPet()}],S.goal,S.sk,code,true)}

 <div class="evt ${evtBad?'bad':''}">${Date.now()<evtT?E(evt):''}</div>
 <div style="text-align:center;margin:8px 0"><div class="big" style="font-size:clamp(34px,11vw,64px);${rq.zh?'':'font-family:var(--f-d);font-size:clamp(24px,7vw,40px)'}">${E(rq.prompt)}</div><div class="muted">${E(rq.sub||'')}</div></div>
 <div class="ans">${rq.opts.map((o,k)=>`<button data-r="${k}" ${lk?'disabled class="dim"':''}>${E(o)}</button>`).join('')}</div>
 <p class="muted" style="text-align:center">${lk?(Date.now()<evtT&&evtBad&&/Xoáy/.test(evt)?'Bị xoáy nước cuốn! Chờ chút…':'Chờ chút…'):S.m==='coop'?'Mỗi câu đúng giúp cả lớp tiến lên':window.RULE==='penalty'?'Đúng thì tiến 1 bước, sai thì lùi 1 bước':window.RULE==='survive'?'Sai 3 lần là bị loại':'Đúng thì tiến thêm 1 bước'}</p></div>
 <div class="card"><h3>Đang dẫn đầu</h3><ul class="rank">${lead.map((p,i)=>`<li class="${p[0]===ID?'me':''}"><span class="n">${i+1}</span><b>${E(p[1])}</b><span>${p[2]}</span></li>`).join('')}</ul></div>`}
document.addEventListener('click',e=>{const gb=e.target.closest&&e.target.closest('button[data-gift]');if(gb&&S&&S.m==='quiz'&&S.ph==='rv'){conn.send({t:'gift',id:ID,q:S.i});gb.disabled=true;return}
 const pb=e.target.closest&&e.target.closest('button[data-pet]');if(pb){RWL.setPet(+pb.dataset.pet);join();render();return}
 const b=e.target.closest&&e.target.closest('button[data-r]');if(!b||!S||(S.m!=='race'&&S.m!=='tug'&&S.m!=='coop')||S.ph!=='run'||Date.now()<rlock)return;const k=+b.dataset.r;
